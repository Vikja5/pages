@font-face{font-family:"Manrope Fallback";src:local("Arial");size-adjust:104%}
:root{--accent:#2563eb;--accent2:#7c3aed;--bg:#fff;--fg:#0f172a;--mute:#5b6478;--card:#f4f6fb;--line:rgba(15,23,42,.12);--r:18px;--font:"Manrope","Manrope Fallback",Arial,sans-serif;--ease:cubic-bezier(.2,.7,.1,1);

[data-theme=dark]{--bg:#0b1020;--fg:#eef1f8;--mute:#a1abc4;--card:#141b33;--line:rgba(255,255,255,.13)}
[data-radius=sharp]{--r:6px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.6;overflow-x:hidden}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(16px,4vw,36px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 26px;border-radius:calc(var(--r) * 3);border:2px solid transparent;background:linear-gradient(135deg,var(--accent),var(--acc-dark));color:#fff;font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s var(--ease),filter .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 38%,transparent);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);box-shadow:none;color:var(--accent)}
.btn.sm{min-height:42px;padding:8px 18px;font-size:.93rem}
.ico{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fld{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.fld input,.fld select,.fld textarea{width:100%;min-height:50px;padding:12px 14px;border-radius:calc(var(--r) * .7);border:1.5px solid var(--line);background:var(--bg);font-weight:400;font-size:1rem;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.fld.bad input{border-color:#d92d20}
.fld .err{color:#d92d20;font-weight:600;font-size:.85rem;min-height:1em}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--mute);cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.ok{display:none;padding:14px 16px;border-radius:calc(var(--r) * .7);background:color-mix(in srgb,#16a34a 14%,var(--bg));border:1.5px solid #16a34a;font-weight:600}
.ok.show{display:block;animation:pop .5s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0) * 70ms)}
.js .rv.in{opacity:1;transform:none}
.demo-pill{position:fixed;left:12px;bottom:12px;z-index:60;max-width:calc(100vw - 24px);padding:7px 14px;border-radius:999px;background:#111827;color:#fff;font-size:.78rem;font-weight:700;letter-spacing:.01em;box-shadow:0 6px 20px rgba(0,0,0,.28);pointer-events:none}
.demo-pill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#facc15;margin-right:8px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none}}
@media print{.demo-pill,.noprint{display:none!important}}

header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;text-decoration:none;white-space:nowrap}
nav.menu{display:flex;gap:6px;margin-left:auto}
nav.menu a{padding:8px 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.95rem;white-space:nowrap;color:var(--mute);transition:.2s}
nav.menu a:hover{background:var(--acc-soft);color:var(--accent)}
.tel{font-weight:800;text-decoration:none;white-space:nowrap}
.burger{display:none;margin-left:auto;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.burger span{display:block;width:20px;height:2px;background:var(--fg);margin:5px auto;transition:.25s}
.hero{position:relative;overflow:hidden;padding:clamp(36px,7vw,90px) 0 clamp(40px,6vw,80px)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.hero:before{width:460px;height:460px;background:var(--accent);right:-120px;top:-120px;opacity:.28}
.hero:after{width:380px;height:380px;background:var(--accent2);left:-140px;bottom:-160px;opacity:.2;animation-delay:-6s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.12)}}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,5vw,64px);align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--acc-soft);color:var(--accent);font-weight:700;font-size:.85rem;margin-bottom:18px}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
h1{font-size:clamp(2.1rem,5.4vw,3.8rem);line-height:1.08;font-weight:800;letter-spacing:-.02em}

.lead{margin-top:20px;font-size:clamp(1.02rem,2vw,1.2rem);color:var(--mute);max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:26px;color:var(--mute);font-weight:600;font-size:.92rem}
.chips span{display:inline-flex;align-items:center;gap:6px}
.chips svg{width:18px;height:18px;color:var(--accent)}
.vis{position:relative;aspect-ratio:1/1.05;min-height:280px}
.vis .panel{position:absolute;inset:6% 4% 6% 8%;border-radius:calc(var(--r) * 2.2);background:linear-gradient(150deg,var(--accent),var(--accent2));box-shadow:0 30px 70px color-mix(in srgb,var(--accent) 35%,transparent);overflow:hidden}
.vis .panel svg{position:absolute;inset:0;width:100%;height:100%}
.float{position:absolute;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:calc(var(--r) * .9);background:var(--bg);color:var(--fg);box-shadow:0 16px 40px rgba(0,0,0,.18);font-weight:700;font-size:.92rem;animation:fl 6s ease-in-out infinite;max-width:80%}

.card h3{font-size:1.15rem;font-weight:800}

.steps{counter-reset:s;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));position:relative}

.alt{background:var(--card)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:34px}
.fact{padding:18px;border-radius:var(--r);background:var(--acc-soft)}

.rev q{quotes:none;display:block;font-size:1rem}.rev .who{font-weight:800;font-size:.92rem}.rev .who small{display:block;font-weight:600;color:var(--mute)}

details{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:0 20px;transition:.25s}
details[open]{border-color:var(--accent);background:var(--bg);box-shadow:0 12px 30px rgba(0,0,0,.08)}
summary{list-style:none;cursor:pointer;padding:18px 0;font-weight:700;display:flex;justify-content:space-between;gap:14px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:1.5rem;color:var(--accent);transition:transform .3s;flex:none}
details[open] summary:after{transform:rotate(45deg)}
details p{padding:0 0 18px;color:var(--mute);animation:pop .4s var(--ease)}
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,52px);align-items:start}
.formbox{padding:clamp(20px,3vw,32px);border-radius:calc(var(--r) * 1.3);background:var(--bg);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.1);display:grid;gap:14px}

.info div{display:flex;gap:12px;align-items:center;font-weight:600}
.info svg{color:var(--accent);flex:none}
footer{padding:28px 0 70px;border-top:1px solid var(--line);color:var(--mute);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
@media (max-width:900px){

@media (max-width:520px){.cta .btn{width:100%}.float{font-size:.82rem;padding:9px 12px}}

function logo(name,size){const l=esc((name||'D').replace(/[^A-Za-zЀ-ӿ0-9]/g,'').slice(0,1).toUpperCase()||'D');
return '<svg width="'+(size||38)+'" height="'+(size||38)+'" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#lg)"/><text x="20" y="27" text-anchor="middle" font-family="Manrope,Arial" font-weight="800" font-size="21" fill="#fff">'+l+'</text></svg>';}
function applyTheme(){const r=document.documentElement;
if(CFG.accent)r.style.setProperty('--accent',CFG.accent);
r.style.setProperty('--accent2',CFG.accent2||CFG.accent||'#7c3aed');
if(CFG.theme==='dark')r.setAttribute('data-theme','dark');
if(CFG.radius==='sharp')r.setAttribute('data-radius','sharp');}
function reveal(){const els=$$('.rv');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
els.forEach((e,i)=>{if(!e.style.getPropertyValue('--i'))e.style.setProperty('--i',i%4);io.observe(e);});
setTimeout(()=>els.forEach(e=>{if(e.getBoundingClientRect().top<innerHeight)e.classList.add('in');}),120);}
function download(name,mime,content){const b=new Blob(['﻿'+content],{type:mime+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const phoneOk=v=>/^\+?[0-9\s()\-]{10,}$/.test(String(v).trim());
function demoPill(){const d=document.createElement('div');d.className='demo-pill';d.innerHTML='<i></i>'+esc(CFG.demo_note||'демо / пример работы, данные условные');document.body.appendChild(d);}
function htmlDoc(title,body,extraCss){return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>'+esc(String(title).replace(/\*/g,''))+'</title><style>body{font-family:Arial,sans-serif;font-size:11pt;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:5px 8px;text-align:left}th{background:#e8e8e8}h1{font-size:18pt}h2{font-size:13pt}'+(extraCss||'')+'</style></head><body>'+body+'</body></html>';}

(function(){
const C=CFG,S=C.services||[];

$('#menu').innerHTML=nav.map(n=>'<a href="'+n[0]+'">'+esc(n[1])+'</a>').join('');
$('#burger').onclick=function(){const o=$('#menu').classList.toggle('open');this.setAttribute('aria-expanded',o);};
$$('#menu a').forEach(a=>a.onclick=()=>$('#menu').classList.remove('open'));
const chips=(C.hero_chips||[]).map((t,i)=>'<span>'+ico('check')+esc(t)+'</span>').join('');
const fl=(C.hero_floats||S.slice(0,3).map(s=>s.title)).slice(0,3).map((t,i)=>'<div class="float">'+ico((S[i]||{}).icon,i)+'<span>'+esc(t)+'</span></div>').join('');
const words=String(C.hero_title||'').split('*');
const h1=words.map((w,i)=>i%2?'<em>'+esc(w)+'</em>':esc(w)).join('');
const stars='<div class="stars" aria-label="5 из 5">'+'<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>'.repeat(5)+'</div>';
const facts=(C.facts||[]).map(f=>'<div class="fact rv"><b>'+esc(f.value)+'</b><span>'+esc(f.label)+'</span></div>').join('');
$('#top').innerHTML=
'<section class="hero"><div class="wrap"><div><span class="tag rv"><i></i>'+esc(C.niche)+' · '+esc(C.city)+'</span>'+
'<h1 class="rv">'+h1+'</h1><p class="lead rv">'+esc(C.hero_text)+'</p>'+
'<div class="cta rv"><a class="btn" href="#contact">'+esc(C.hero_cta||'Оставить заявку')+'</a><a class="btn ghost" href="#services">'+esc(C.hero_cta2||'Смотреть услуги')+'</a></div>'+
'<div class="chips rv">'+chips+'</div></div>'+
'<div class="vis rv"><div class="panel"><svg viewBox="0 0 400 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="300" cy="90" r="120" fill="#fff" opacity=".12"/><circle cx="80" cy="360" r="150" fill="#fff" opacity=".1"/><path d="M0 300C90 250 150 340 240 290S350 230 400 270V420H0z" fill="#fff" opacity=".16"/><path d="M0 340C100 300 160 380 260 330S360 300 400 330V420H0z" fill="#fff" opacity=".14"/><g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"><circle cx="200" cy="170" r="62"/><circle cx="200" cy="170" r="92" stroke-dasharray="4 10"/></g><g style="transform-origin:200px 170px;animation:spin 30s linear infinite"><circle cx="200" cy="78" r="7" fill="#fff"/></g></svg></div>'+fl+'</div></div></section>'+
'<section id="services" class="alt"><div class="wrap"><div class="sec-h rv"><small>'+esc(C.niche)+'</small><h2>'+esc(C.services_title||'Услуги и цены')+'</h2><p>'+esc(C.services_text||'Ориентировочные цены «от», точный расчёт после уточнения задачи.')+'</p></div><div class="grid">'+
S.map((s,i)=>'<article class="card rv"><div class="ic">'+ico(s.icon,i)+'</div><h3>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p><div class="price"><small>от </small>'+esc(s.price)+'</div><a class="btn ghost sm" href="#contact" data-s="'+esc(s.title)+'">Выбрать</a></article>').join('')+
'</div>'+(facts?'<div class="facts">'+facts+'</div>':'')+'</div></section>'+
'<section id="steps"><div class="wrap"><div class="sec-h rv"><small>Процесс</small><h2>'+esc(C.steps_title||'Как мы работаем')+'</h2></div><div class="steps">'+
(C.steps||[]).map(s=>'<div class="step rv"><h3>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p></div>').join('')+'</div></div></section>'+
((C.benefits||[]).length?'<section class="alt"><div class="wrap"><div class="sec-h rv"><small>Преимущества</small><h2>'+esc(C.benefits_title||'Почему выбирают нас')+'</h2></div><div class="grid">'+
C.benefits.map((b,i)=>'<div class="card rv"><div class="ic">'+ico(b.icon,i+3)+'</div><h3>'+esc(b.title)+'</h3><p>'+esc(b.text)+'</p></div>').join('')+'</div></div></section>':'')+
((C.reviews||[]).length?'<section id="reviews"><div class="wrap"><div class="sec-h rv"><small>Отзывы</small><h2>Что пишут клиенты</h2><p>Отзывы ниже — пример оформления блока, не реальные.</p></div><div class="grid">'+
C.reviews.map(r=>'<figure class="card rev rv" style="margin:0">'+stars+'<q>'+esc(r.text)+'</q><div class="who">'+esc(r.name)+'<small>'+esc(r.role||'пример отзыва')+'</small></div></figure>').join('')+'</div></div></section>':'')+
'<section id="faq" class="alt"><div class="wrap"><div class="sec-h rv"><small>FAQ</small><h2>Частые вопросы</h2></div><div class="faq">'+
(C.faq||[]).map((f,i)=>'<details class="rv"'+(i===0?' open':'')+'><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>').join('')+'</div></div></section>'+
'<section id="contact"><div class="wrap contact"><div class="rv"><div class="sec-h" style="margin-bottom:0"><small>Контакты</small><h2>'+esc(C.form_title||'Оставьте заявку')+'</h2><p>'+esc(C.form_text||'Перезвоним и уточним детали.')+'</p></div><div class="info">'+
'<div>'+ico('phone')+'<span>'+esc(C.phone)+'</span></div>'+(C.address?'<div>'+ico('pin')+'<span>'+esc(C.address)+'</span></div>':'')+(C.hours?'<div>'+ico('clock')+'<span>'+esc(C.hours)+'</span></div>':'')+(C.email?'<div>'+ico('mail')+'<span>'+esc(C.email)+'</span></div>':'')+'</div></div>'+
'<form class="formbox rv" id="f" novalidate><label class="fld"><span>Имя</span><input name="n" autocomplete="name" placeholder="Как к вам обращаться"></label>'+
'<label class="fld" id="pf"><span>Телефон</span><input name="p" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 (000) 000-00-00"><span class="err"></span></label>'+
'<label class="fld"><span>Что вас интересует</span><select name="s" id="sel">'+S.map(s=>'<option>'+esc(s.title)+'</option>').join('')+'</select></label>'+
'<label class="chk"><input type="checkbox" id="agree"><span>Согласен на обработку персональных данных (в демо данные никуда не отправляются)</span></label>'+
'<button class="btn" type="submit">'+esc(C.form_button||'Отправить заявку')+'</button><p class="ok" id="ok" role="status">'+esc(C.form_ok||'Заявка принята (демо: никуда не отправлена). Так это будет работать на готовом сайте.')+'</p></form></div></section>';
