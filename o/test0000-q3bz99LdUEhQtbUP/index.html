.exp button:hover{background:#fff;color:var(--acc-dark);transform:translateY(-2px)}

.res .btn{background:#fff;color:var(--acc-dark)}

if(CFG.accent)r.style.setProperty('--accent',CFG.accent);
r.style.setProperty('--accent2',CFG.accent2||CFG.accent||'#7c3aed');
if(CFG.theme==='dark')r.setAttribute('data-theme','dark');
if(CFG.radius==='sharp')r.setAttribute('data-radius','sharp');}
function reveal(){const els=$$('.rv');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
els.forEach((e,i)=>{if(!e.style.getPropertyValue('--i'))e.style.setProperty('--i',i%4);io.observe(e);});
setTimeout(()=>els.forEach(e=>{if(e.getBoundingClientRect().top<innerHeight)e.classList.add('in');}),120);}
function download(name,mime,content){const b=new Blob(['﻿'+content],{type:mime+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const phoneOk=v=>/^\+?[0-9\s()\-]{10,}$/.test(String(v).trim());
function demoPill(){const d=document.createElement('div');d.className='demo-pill';d.innerHTML='<i></i>'+esc(CFG.demo_note||'демо / пример работы, данные условные');document.body.appendChild(d);}
function htmlDoc(title,body,extraCss){return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>'+esc(String(title).replace(/\*/g,''))+'</title><style>body{font-family:Arial,sans-serif;font-size:11pt;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:5px 8px;text-align:left}th{background:#e8e8e8}h1{font-size:18pt}h2{font-size:13pt}'+(extraCss||'')+'</style></head><body>'+body+'</body></html>';}
document.documentElement.classList.add('js');
applyTheme();

(function(){
const C=CFG,F=C.fields||[],ids=F.map(f=>f.id),cur=C.currency||'₽';
const st={};
F.forEach(f=>{st[f.id]=f.type==='check'?(f.default?1:0):f.type==='select'||f.type==='tiles'?(f.default!=null?f.default:(f.options[0]||{}).value):(f.default!=null?f.default:(f.min||0));});
try{const h=location.hash.slice(1);if(h){const o=JSON.parse(decodeURIComponent(escape(atob(h))));ids.forEach(i=>{if(o[i]!=null)st[i]=o[i];});}}catch(e){}
$('#brand').innerHTML=logo(C.brand||C.title)+'<span>'+esc(C.brand||C.title)+'</span>';
$('#niche').textContent=C.niche||'';
const t=String(C.title||'').split('*');$('#h1').innerHTML=t.map((w,i)=>i%2?'<em>'+esc(w)+'</em>':esc(w)).join('');
$('#sub').textContent=C.subtitle||'';
$('#rt').textContent=C.result_title||'Ориентировочная стоимость';
$('#ctab').textContent=C.cta_text||'Оставить заявку на точный расчёт';
$('#disc').textContent=C.disclaimer||'Расчёт ориентировочный; цифры в демо условные.';
$('#lh').textContent=C.form_title||'Отправить расчёт на проверку';
$('#ls').textContent=C.form_text||'Мы уточним детали и пришлём точную смету.';
$('#send').textContent=C.form_button||'Отправить заявку с расчётом';
$('#dbtn').textContent=C.dock_button||'Смета';
const wrap=document.createElement('div');
function fieldHtml(f){const v=st[f.id],u=f.unit?' '+esc(f.unit):'';
const head=(val)=>'<div class="lab"><span>'+esc(f.label)+(f.hint?'<br><span class="hint">'+esc(f.hint)+'</span>':'')+'</span>'+(val?'<span class="val" data-v="'+f.id+'">'+val+'</span>':'')+'</div>';
if(f.type==='range')return '<div class="q">'+head(fmt(v)+u)+'<input type="range" data-f="'+f.id+'" min="'+f.min+'" max="'+f.max+'" step="'+(f.step||1)+'" value="'+v+'" aria-label="'+esc(f.label)+'"></div>';
if(f.type==='number')return '<div class="q">'+head('')+'<div class="num"><button type="button" data-d="-1" data-f="'+f.id+'" aria-label="Меньше">−</button><input type="number" inputmode="decimal" data-f="'+f.id+'" min="'+(f.min||0)+'" '+(f.max!=null?'max="'+f.max+'"':'')+' step="'+(f.step||1)+'" value="'+v+'" aria-label="'+esc(f.label)+'"><button type="button" data-d="1" data-f="'+f.id+'" aria-label="Больше">+</button></div></div>';
if(f.type==='select')return '<div class="q"><label class="fld"><span>'+esc(f.label)+'</span><select data-f="'+f.id+'">'+f.options.map(o=>'<option value="'+o.value+'"'+(o.value==v?' selected':'')+'>'+esc(o.label)+'</option>').join('')+'</select></label></div>';
if(f.type==='tiles')return '<div class="q" role="radiogroup" aria-label="'+esc(f.label)+'">'+head('')+'<div class="tiles">'+f.options.map(o=>'<label class="tile"><input type="radio" name="'+f.id+'" data-f="'+f.id+'" value="'+o.value+'"'+(o.value==v?' checked':'')+'><span>'+esc(o.label)+(o.hint?'<small>'+esc(o.hint)+'</small>':'')+'</span></label>').join('')+'</div></div>';
if(f.type==='check')return '<div class="q"><label class="sw"><input type="checkbox" data-f="'+f.id+'"'+(v?' checked':'')+'><i></i><span>'+esc(f.label)+(f.hint?'<small>'+esc(f.hint)+'</small>':'')+'</span></label></div>';
return '';}
$('#fields').innerHTML=F.map(fieldHtml).join('');
const fns=(C.rows||[]).map(r=>({r,f:new Function(...ids,'return ('+r.expr+')'),w:r.when?new Function(...ids,'return ('+r.when+')'):null}));
const tf=C.time?new Function(...ids,'return ('+C.time.expr+')'):null;
function vals(){return ids.map(i=>{const x=Number(st[i]);return Number.isFinite(x)?x:0;});}
function lab(l){return String(l).replace(/\{(\w+)\}/g,(m,k)=>{const f=F.find(x=>x.id===k);if(!f)return m;if(f.options){const o=f.options.find(o=>o.value==st[k]);return o?o.label:'';}return fmt(Number(st[k]));});}
let shown=0,calc={total:0,lines:[],time:null};
function compute(){const a=vals(),lines=[];let sum=0;
fns.forEach(({r,f,w})=>{try{if(w&&!w(...a))return;let x=f(...a);if(!Number.isFinite(x))x=0;x=Math.round(x);if(x===0&&r.hide0!==false)return;lines.push([lab(r.label),x]);sum+=x;}catch(e){}});
let total=Math.max(sum,Math.round(C.min_total||0));
if(sum<(C.min_total||0)&&sum>0)lines.push(['Минимальный заказ',total-sum]);
let tm=null;if(tf){try{tm=Math.max(0,Math.round(tf(...a)));}catch(e){}}
calc={total,lines,time:tm};render();}
function animate(to){const from=shown,t0=performance.now();cancelAnimationFrame(animate.id);(function s(n){const k=Math.min(1,(n-t0)/380),e=1-Math.pow(1-k,3);shown=from+(to-from)*e;$('#total').textContent=money(shown).replace('₽',cur);$('#dtotal').textContent=$('#total').textContent;if(k<1)animate.id=requestAnimationFrame(s);})(t0);}
function render(){animate(calc.total);
$('#lines').innerHTML=calc.lines.map(l=>'<div><span>'+esc(l[0])+'</span><span>'+(l[1]<0?'−':'')+fmt(Math.abs(l[1]))+' '+cur+'</span></div>').join('')||'<div><span>Выберите параметры</span></div>';
$('#tm').innerHTML=calc.time!=null&&C.time?ico('clock')+'<span>'+esc(C.time.label||'Срок')+': '+fmt(calc.time)+' '+esc(C.time.unit||'дн.')+'</span>':'';
try{history.replaceState(null,'','#'+btoa(unescape(encodeURIComponent(JSON.stringify(st)))));}catch(e){}}
function setRange(el){const p=(el.value-el.min)/(el.max-el.min)*100;el.style.setProperty('--p',p+'%');}
$('#fields').addEventListener('input',e=>{const el=e.target,id=el.dataset.f;if(!id)return;
if(el.type==='checkbox')st[id]=el.checked?1:0;else if(el.type==='radio'||el.tagName==='SELECT')st[id]=Number(el.value);else{let n=Number(el.value);if(el.value==='')n=0;st[id]=n;}
if(el.type==='range'){setRange(el);const f=F.find(x=>x.id===id);$('[data-v="'+id+'"]').textContent=fmt(Number(el.value))+(f.unit?' '+f.unit:'');}
compute();});
$('#fields').addEventListener('click',e=>{const b=e.target.closest('button[data-d]');if(!b)return;const id=b.dataset.f,f=F.find(x=>x.id===id),inp=$('input[data-f="'+id+'"]');let n=Number(inp.value||0)+Number(b.dataset.d)*(f.step||1);if(f.min!=null)n=Math.max(f.min,n);if(f.max!=null)n=Math.min(f.max,n);inp.value=n;st[id]=n;compute();});
$$('input[type=range]').forEach(setRange);
// выгрузки
const when=new Date().toLocaleDateString('ru-RU');
function params(){return F.map(f=>{let v=st[f.id];if(f.options){const o=f.options.find(o=>o.value==v);v=o?o.label:'';}else if(f.type==='check')v=v?'да':'нет';else v=fmt(Number(v))+(f.unit?' '+f.unit:'');return [f.label,v];});}
function sheetHtml(){return '<h1>'+esc(C.doc_title||C.title.replace(/\*/g,''))+'</h1><small>'+esc(C.brand||'')+' · '+when+' · '+esc(C.demo_note||'демо / пример работы, данные условные')+'</small><table><tr><th>Параметр</th><th>Значение</th></tr>'+params().map(p=>'<tr><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td></tr>').join('')+'</table><table><tr><th>Позиция</th><th>Сумма</th></tr>'+calc.lines.map(l=>'<tr><td>'+esc(l[0])+'</td><td>'+fmt(l[1])+' '+cur+'</td></tr>').join('')+'</table><p class="big">Итого: '+fmt(calc.total)+' '+cur+'</p>'+(calc.time!=null&&C.time?'<p>'+esc(C.time.label||'Срок')+': '+fmt(calc.time)+' '+esc(C.time.unit||'дн.')+'</p>':'')+'<p><small>'+esc(C.disclaimer||'')+'</small></p>';}
const EXP={pdf:['PDF','download',()=>{$('#sheet').innerHTML=sheetHtml();window.print();}],
doc:['DOC','doc',()=>download('raschet.doc','application/msword',htmlDoc(C.title,sheetHtml()))],
xls:['XLS','chart',()=>download('raschet.xls','application/vnd.ms-excel',htmlDoc(C.title,sheetHtml()))],
link:['Ссылка','send',()=>{const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>flash('Ссылка скопирована'),()=>flash('Скопируйте адрес из строки браузера'));}]};
function flash(m){const b=$('#exp [data-x=link]');if(b){const o=b.innerHTML;b.textContent=m;setTimeout(()=>b.innerHTML=o,1800);}}
$('#exp').innerHTML=(C.export||['pdf','doc','xls','link']).concat(C.export&&C.export.includes('link')?[]:['link']).filter((v,i,a)=>EXP[v]&&a.indexOf(v)===i).map(k=>'<button type="button" data-x="'+k+'">'+ico(EXP[k][1])+EXP[k][0]+'</button>').join('');
$('#exp').addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(b)EXP[b.dataset.x][2]();});
$('#f').addEventListener('submit',e=>{e.preventDefault();const f=e.target,pf=$('#pf');let ok=true;
if(!phoneOk(f.p.value)){pf.classList.add('bad');$('.err',pf).textContent='Введите телефон, минимум 10 цифр';ok=false;}else{pf.classList.remove('bad');$('.err',pf).textContent='';}
if(!$('#agree').checked){ok=false;$('#agree').focus();}
if(ok){$('#ok').textContent=(C.form_ok||'Заявка отправлена (демо: никуда не передана). Расчёт приложен')+': '+fmt(calc.total)+' '+cur+'.';$('#ok').classList.add('show');}});
compute();reveal();demoPill();
})();
</script>
</body>
</html>
