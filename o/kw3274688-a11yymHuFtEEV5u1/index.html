<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соседи — строительство домов из бруса и каркасных домов (демо)</title>
<meta name="description" content="Демо / пример работы: Соседи, Каркасные дома, Иркутск">
<link rel="preload" href="fonts/Manrope-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Manrope-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Manrope";src:url("fonts/Manrope-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Manrope";src:url("fonts/Manrope-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:block}
@font-face{font-family:"Manrope";src:url("fonts/Manrope-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:"Manrope";src:url("fonts/Manrope-ExtraBold.woff2") format("woff2");font-weight:800 900;font-style:normal;font-display:block}
@font-face{font-family:"Manrope Fallback";src:local("Arial");size-adjust:104%}
:root{--accent:#2563eb;--accent2:#7c3aed;--bg:#fff;--fg:#0f172a;--mute:#5b6478;--card:#f4f6fb;--line:rgba(15,23,42,.12);--r:18px;--font:"Manrope","Manrope Fallback",Arial,sans-serif;--ease:cubic-bezier(.2,.7,.1,1);
--acc-soft:color-mix(in srgb,var(--accent) 12%,var(--bg));--acc-dark:color-mix(in srgb,var(--accent) 82%,#000)}
[data-theme=dark]{--bg:#0b1020;--fg:#eef1f8;--mute:#a1abc4;--card:#141b33;--line:rgba(255,255,255,.13)}
[data-radius=sharp]{--r:6px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.6;overflow-x:hidden}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(16px,4vw,36px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 26px;border-radius:calc(var(--r) * 3);border:2px solid transparent;background:linear-gradient(135deg,var(--accent),var(--acc-dark));color:#fff;font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s var(--ease),filter .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 38%,transparent);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);box-shadow:none;color:var(--accent)}
.btn.sm{min-height:42px;padding:8px 18px;font-size:.93rem}
.ico{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fld{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.fld input,.fld select,.fld textarea{width:100%;min-height:50px;padding:12px 14px;border-radius:calc(var(--r) * .7);border:1.5px solid var(--line);background:var(--bg);font-weight:400;font-size:1rem;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.fld.bad input{border-color:#d92d20}
.fld .err{color:#d92d20;font-weight:600;font-size:.85rem;min-height:1em}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--mute);cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.ok{display:none;padding:14px 16px;border-radius:calc(var(--r) * .7);background:color-mix(in srgb,#16a34a 14%,var(--bg));border:1.5px solid #16a34a;font-weight:600}
.ok.show{display:block;animation:pop .5s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0) * 70ms)}
.js .rv.in{opacity:1;transform:none}
.demo-pill{position:fixed;left:12px;bottom:12px;z-index:60;max-width:calc(100vw - 24px);padding:7px 14px;border-radius:999px;background:#111827;color:#fff;font-size:.78rem;font-weight:700;letter-spacing:.01em;box-shadow:0 6px 20px rgba(0,0,0,.28);pointer-events:none}
.demo-pill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#facc15;margin-right:8px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none}}
@media print{.demo-pill,.noprint{display:none!important}}

[hidden]{display:none!important}
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;text-decoration:none;white-space:nowrap;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis}
nav.menu{display:flex;gap:4px;margin-left:auto}
nav.menu a{padding:8px 11px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.93rem;white-space:nowrap;color:var(--mute);transition:.2s}
nav.menu a:hover{background:var(--acc-soft);color:var(--accent)}
.tel{font-weight:800;text-decoration:none;white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px}
.tools:empty{display:none}
.chip,.lang button,.chips2 button,.tabs button,.tiles button,.drop button{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--fg);transition:.2s}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.9rem}
.chip svg{width:18px;height:18px;color:var(--accent)}
.chip span{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover,.lang button:hover,.chips2 button:hover{border-color:var(--accent);color:var(--accent)}
.pick{position:relative}
.drop{position:absolute;right:0;top:calc(100% + 8px);min-width:190px;max-height:320px;overflow:auto;padding:8px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.18);display:grid;gap:2px;z-index:70}
.drop button{border:0;text-align:left;padding:10px 12px;border-radius:calc(var(--r) * .6);font-weight:600}
.drop button:hover,.drop button.on{background:var(--acc-soft);color:var(--accent)}
.lang{display:flex;gap:4px}
.lang button{min-width:40px;min-height:40px;padding:0 8px;border-radius:999px;font-weight:800;font-size:.8rem}
.lang button.on,.chips2 button.on,.tabs button.on,.tiles button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.burger{display:none;margin-left:auto;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.tools:not(:empty)+.burger{margin-left:0}
.burger span{display:block;width:20px;height:2px;background:var(--fg);margin:5px auto;transition:.25s}
.hero{position:relative;overflow:hidden;padding:clamp(36px,7vw,90px) 0 clamp(40px,6vw,80px)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.hero:before{width:460px;height:460px;background:var(--accent);right:-120px;top:-120px;opacity:.28}
.hero:after{width:380px;height:380px;background:var(--accent2);left:-140px;bottom:-160px;opacity:.2;animation-delay:-6s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.12)}}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,5vw,64px);align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--acc-soft);color:var(--accent);font-weight:700;font-size:.85rem;margin-bottom:18px}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
h1{font-size:clamp(2.1rem,5.4vw,3.8rem);line-height:1.08;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin-top:20px;font-size:clamp(1.02rem,2vw,1.2rem);color:var(--mute);max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:26px;color:var(--mute);font-weight:600;font-size:.92rem}
.chips span{display:inline-flex;align-items:center;gap:6px}
.chips svg{width:18px;height:18px;color:var(--accent)}
.vis{position:relative;aspect-ratio:1/1.05;min-height:280px}
.vis .panel{position:absolute;inset:6% 4% 6% 8%;border-radius:calc(var(--r) * 2.2);background:linear-gradient(150deg,var(--accent),var(--accent2));box-shadow:0 30px 70px color-mix(in srgb,var(--accent) 35%,transparent);overflow:hidden}
.vis .panel svg{position:absolute;inset:0;width:100%;height:100%}
.float{position:absolute;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:calc(var(--r) * .9);background:var(--bg);color:var(--fg);box-shadow:0 16px 40px rgba(0,0,0,.18);font-weight:700;font-size:.92rem;animation:fl 6s ease-in-out infinite;max-width:80%}
.float svg{color:var(--accent);flex:none}
.float:nth-of-type(2){left:-2%;top:12%}.float:nth-of-type(3){right:-2%;top:46%;animation-delay:-2s}.float:nth-of-type(4){left:6%;bottom:6%;animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-12px)}}
.art .tl{transform-box:fill-box;transform-origin:center;animation:tl 4s ease-in-out infinite}
@keyframes tl{50%{transform:scale(.84)}}
.art .wn{opacity:.55;animation:wn 5s ease-in-out infinite}
@keyframes wn{50%{opacity:.12}}
.art .fly{transform-box:fill-box;transform-origin:center;animation:fly 5.4s cubic-bezier(.2,.7,.1,1) infinite;opacity:0}
@keyframes fly{0%{transform:translateY(60px) scale(.4);opacity:0}22%{opacity:1}60%{transform:translateY(-110px) scale(1) rotate(8deg);opacity:1}100%{transform:translateY(-220px) scale(.9) rotate(20deg);opacity:0}}
.art .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:ln 3.4s ease-out infinite alternate}
@keyframes ln{to{stroke-dashoffset:0}}
.art .gb{transform-box:fill-box;transform-origin:50% 100%;animation:gb 3.4s ease-out infinite alternate}
@keyframes gb{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
section{padding:clamp(44px,7vw,92px) 0}
.sec-h{max-width:40em;margin-bottom:clamp(24px,4vw,44px)}
.sec-h small{display:block;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;margin-bottom:10px}
h2{font-size:clamp(1.65rem,3.6vw,2.6rem);line-height:1.15;font-weight:800;letter-spacing:-.015em}
.sec-h p{margin-top:12px;color:var(--mute)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.card{position:relative;padding:26px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(0,0,0,.12);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.card .ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:var(--acc-soft);color:var(--accent);margin-bottom:4px;transition:.3s}
.card:hover .ic{background:var(--accent);color:#fff;transform:rotate(-6deg) scale(1.06)}
.card h3{font-size:1.15rem;font-weight:800}
.card p{color:var(--mute);font-size:.96rem;flex:1}
.price{font-weight:800;font-size:1.1rem;color:var(--accent)}
.price small{font-weight:600;color:var(--mute);font-size:.8rem}
.card .btn{margin-top:6px;align-self:flex-start}
.steps{counter-reset:s;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));position:relative}
.step{padding:22px;border-radius:var(--r);border:1.5px dashed var(--line);position:relative}
.step:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;margin-bottom:12px}
.step h3{font-size:1.05rem;font-weight:800;margin-bottom:6px}.step p{color:var(--mute);font-size:.94rem}
.alt{background:var(--card)}
.alt .card{background:var(--bg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:34px}
.fact{padding:18px;border-radius:var(--r);background:var(--acc-soft)}
.fact b{display:block;font-size:1.6rem;font-weight:800;color:var(--accent)}.fact span{font-size:.9rem;color:var(--mute)}
.rev q{quotes:none;display:block;font-size:1rem}.rev .who{font-weight:800;font-size:.92rem}.rev .who small{display:block;font-weight:600;color:var(--mute)}
.stars{color:#f59e0b;display:flex;gap:2px}.stars svg{width:18px;height:18px;fill:currentColor;stroke:none}
.faq{max-width:820px;display:grid;gap:10px}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:0 20px;transition:.25s}
details[open]{border-color:var(--accent);background:var(--bg);box-shadow:0 12px 30px rgba(0,0,0,.08)}
summary{list-style:none;cursor:pointer;padding:18px 0;font-weight:700;display:flex;justify-content:space-between;gap:14px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:1.5rem;color:var(--accent);transition:transform .3s;flex:none}
details[open] summary:after{transform:rotate(45deg)}
details p{padding:0 0 18px;color:var(--mute);animation:pop .4s var(--ease)}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chips2 button{min-height:42px;padding:6px 18px;border-radius:999px;font-weight:700;font-size:.92rem}
.prod.hide{display:none}
.prod .sw{position:relative;height:120px;border-radius:calc(var(--r) * .8);display:grid;place-items:center;color:#fff;overflow:hidden;margin-bottom:6px}
.prod .sw:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--accent),var(--accent2));filter:hue-rotate(var(--h,0deg))}
.prod .sw svg{position:relative;width:44px;height:44px}
.prod .tg{align-self:flex-start;padding:3px 10px;border-radius:999px;background:var(--acc-soft);color:var(--accent);font-weight:700;font-size:.78rem}
.calcbox{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(18px,3vw,36px);align-items:start}
.cf{display:grid;gap:16px;padding:clamp(18px,3vw,28px);border-radius:calc(var(--r) * 1.2);background:var(--bg);border:1px solid var(--line)}
.cr{padding:clamp(18px,3vw,28px);border-radius:calc(var(--r) * 1.2);background:linear-gradient(150deg,var(--accent),var(--accent2));color:#fff;display:grid;gap:12px;position:sticky;top:90px}
.crow{display:flex;justify-content:space-between;gap:12px;font-weight:600;opacity:.92;font-size:.96rem}
.ctot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.4);font-weight:700}
.ctot b{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800}
.cr .note{font-size:.85rem;opacity:.85}
.cr .btn{background:#fff;color:var(--accent);justify-self:start}
.fld output{float:right;font-weight:800;color:var(--accent)}
.fld input[type=range]{padding:0;min-height:36px;accent-color:var(--accent);border:0;background:none}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tiles button{min-height:44px;padding:6px 16px;border-radius:calc(var(--r) * .7);font-weight:700}
.tgl{display:flex;gap:10px;align-items:center;font-weight:600}
.tgl input{width:20px;height:20px;accent-color:var(--accent)}
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,52px);align-items:start}
.formbox{padding:clamp(20px,3vw,32px);border-radius:calc(var(--r) * 1.3);background:var(--bg);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.1);display:grid;gap:14px}
.tabform{display:grid;gap:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{min-height:42px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.88rem}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.hint,.note2{font-weight:400;font-size:.82rem;color:var(--mute)}
.picked{margin-top:14px;padding:10px 14px;border-radius:calc(var(--r) * .7);background:var(--acc-soft);color:var(--accent);font-weight:700}
.info{display:grid;gap:14px;margin-top:22px}
.info div{display:flex;gap:12px;align-items:center;font-weight:600}
.info svg{color:var(--accent);flex:none}
.pgh{padding:clamp(36px,6vw,70px) 0 10px}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;color:var(--accent);font-weight:700;text-decoration:none}
footer{padding:28px 0 70px;border-top:1px solid var(--line);color:var(--mute);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
@media (max-width:900px){
.hero .wrap,.contact,.calcbox{grid-template-columns:minmax(0,1fr)}
.cr{position:static}
.vis{max-width:420px;width:100%;margin:0 auto}
}
@media (max-width:900px){
nav.menu{position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--bg);padding:10px 16px 16px;border-bottom:1px solid var(--line);display:none;margin:0}
nav.menu.open{display:flex}nav.menu a{padding:12px}
.burger{display:block}.bar .tel{display:none}
}
header.many nav.menu{position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--bg);padding:10px 16px 16px;border-bottom:1px solid var(--line);display:none;margin:0}
header.many nav.menu.open{display:flex}header.many nav.menu a{padding:12px}
header.many .burger{display:block}header.many .bar .tel{display:none}
header.many .tools{margin-left:auto}
@media (max-width:900px){.tools{margin-left:auto}}
@media (max-width:520px){.cta .btn{width:100%}.float{font-size:.82rem;padding:9px 12px}.brand{font-size:1rem}.brand span{max-width:36vw}.chip span{max-width:58px}.chip{padding:6px 10px}.lang button{min-width:36px;padding:0 6px}.bar{gap:6px}}
</style>
</head>
<body>
<header class="top" id="hdr"><div class="wrap bar" style="position:relative">
<a class="brand" href="#top" id="brand"></a>
<nav class="menu" id="menu" aria-label="Меню"></nav>
<a class="tel" id="tel" href="#"></a>
<div class="tools" id="tools"></div>
<button class="burger" id="burger" aria-label="Меню" aria-expanded="false"><span></span><span></span><span></span></button>
</div></header>

$$('.fld',form).forEach(w=>{const i=$('input:not([type=file]),textarea,select',w);if(!i)return;const req=i.hasAttribute('data-req'),v=String(i.value).trim();let m='';
if(req&&!v)m=i.type==='tel'?U.err_phone:U.err_req;else if(i.type==='tel'&&v&&!phoneOk(v))m=U.err_phone;
w.classList.toggle('bad',!!m);const e=$('.err',w);if(e)e.textContent=m;if(m)ok=false;});

$$('form.tabform').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();if(!validate(f))return;$('.ok',f).classList.add('show');f.reset();$$('.thumbs',f).forEach(t=>t.innerHTML='');st.picked='';showPicked();}));

const cur2=CI.currency||'₽',fm=n=>fmt(Math.round(n))+' '+cur2;
const val=f=>{const el=$('[data-c="'+f.id+'"]');if(!el)return 0;if(f.type==='tiles')return parseFloat(el.dataset.v)||0;if(f.type==='check')return el.checked?1:0;return parseFloat(el.value)||0;};
const txt=f=>{const el=$('[data-c="'+f.id+'"]');if(!el)return'';if(f.type==='tiles'){const b=$('.on',el);return b?b.textContent:'';}if(f.type==='select')return el.options[el.selectedIndex].text;if(f.type==='check')return el.checked?'да':'нет';return el.value+(f.unit?' '+f.unit:'');};
function calc(){const v=ids.map((id,i)=>val(CI.fields[i]));let tot=0,rows='',sum=[];
CI.rows.forEach((r,i)=>{let x=0;try{x=Number(fn[i](...v))||0;}catch(e){}tot+=x;const lab=String(r.label||'').replace(/\{(\w+)\}/g,(m,k)=>{const j=ids.indexOf(k);return j>-1?val(CI.fields[j]):m;});
if(r.when){let w=1;try{w=new Function(...ids,'return ('+r.when+')')(...v);}catch(e){}if(!w){tot-=x;return;}}
rows+='<div class="crow"><span>'+esc(lab)+'</span><b>'+esc(fm(x))+'</b></div>';sum.push(lab+': '+fm(x));});
