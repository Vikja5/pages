box:'<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>',
cam:'<path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
send:'<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>',download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',play:'<path d="M7 4l13 8-13 8z"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',pc:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
chat:'<path d="M4 5h16v11H9l-5 4z"/>',table:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M3 15h18M9 5v14"/>',code:'<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>'};
const ICON_KEYS=Object.keys(ICONS);
const ico=(n,i)=>'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||ICONS[ICON_KEYS[(i||0)%ICON_KEYS.length]])+'</svg>';
function logo(name,size){const l=esc((name||'D').replace(/[^A-Za-zЀ-ӿ0-9]/g,'').slice(0,1).toUpperCase()||'D');
return '<svg width="'+(size||38)+'" height="'+(size||38)+'" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#lg)"/><text x="20" y="27" text-anchor="middle" font-family="Manrope,Arial" font-weight="800" font-size="21" fill="#fff">'+l+'</text></svg>';}
function applyTheme(){const r=document.documentElement;
if(CFG.accent)r.style.setProperty('--accent',CFG.accent);
r.style.setProperty('--accent2',CFG.accent2||CFG.accent||'#7c3aed');
if(CFG.theme==='dark')r.setAttribute('data-theme','dark');
if(CFG.radius==='sharp')r.setAttribute('data-radius','sharp');}
function reveal(){const els=$$('.rv');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
els.forEach((e,i)=>{if(!e.style.getPropertyValue('--i'))e.style.setProperty('--i',i%4);io.observe(e);});
setTimeout(()=>els.forEach(e=>{if(e.getBoundingClientRect().top<innerHeight)e.classList.add('in');}),120);}
function download(name,mime,content){const b=new Blob(['﻿'+content],{type:mime+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const phoneOk=v=>/^\+?[0-9\s()\-]{10,}$/.test(String(v).trim());
function demoPill(){const d=document.createElement('div');d.className='demo-pill';d.innerHTML='<i></i>'+esc(CFG.demo_note||'демо / пример работы, данные условные');document.body.appendChild(d);}
function htmlDoc(title,body,extraCss){return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>'+esc(String(title).replace(/\*/g,''))+'</title><style>body{font-family:Arial,sans-serif;font-size:11pt;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:5px 8px;text-align:left}th{background:#e8e8e8}h1{font-size:18pt}h2{font-size:13pt}'+(extraCss||'')+'</style></head><body>'+body+'</body></html>';}
document.documentElement.classList.add('js');
applyTheme();

(function(){
const C=CFG,B=C.bot||{},N=C.nodes;
$('#tag').textContent=C.tag||'Telegram-бот';
$('#h1').innerHTML=String(C.title||B.name).split('*').map((w,i)=>i%2?'<em>'+esc(w)+'</em>':esc(w)).join('');
$('#lead').textContent=C.lead||'';
$('#hint').innerHTML=ico('play')+'<span>'+esc(C.hint||'Это живой пример: нажимайте кнопки в чате или пишите сообщения.')+'</span>';
$('#feat').innerHTML=(C.features||[]).map((f,i)=>'<li class="rv">'+ico(f.icon||'check',i)+'<div><b>'+esc(f.title)+'</b><span>'+esc(f.text||'')+'</span></div></li>').join('');
$('#ava').textContent=(B.avatar||B.name||'B').slice(0,1).toUpperCase();
$('#bn').textContent=B.name;$('#bu').textContent=(B.username?'@'+B.username+' · ':'')+'бот';
$('#admh').textContent=C.admin_title||'Что получит администратор';
const chat=$('#chat');let vars={},pending=null,busy=false,tok=0;
const T=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const sub=s=>String(s).replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:'—');
const rich=s=>esc(sub(s)).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const scroll=()=>{chat.scrollTop=chat.scrollHeight;};
function bubble(t,who){const d=document.createElement('div');d.className='m '+who;d.innerHTML=who==='b'?rich(t)+'<small>'+T()+'</small>':esc(t)+'<small>'+T()+'</small>';chat.appendChild(d);scroll();return d;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
function kbRemove(){$$('.kb',chat).forEach(k=>k.querySelectorAll('button').forEach(b=>b.disabled=true));}
function notify(n){const rows=n.notify===true?Object.entries(vars):(n.notify||[]).map(k=>[k,vars[k]]);
const lab=C.labels||{};const el=document.createElement('div');el.className='note';el.innerHTML='<b>'+esc(C.admin_note||'Новая заявка')+'</b>'+rows.map(r=>'<div><span>'+esc(lab[r[0]]||r[0])+'</span><span>'+esc(r[1]==null?'—':r[1])+'</span></div>').join('');
$('#adm').classList.add('on');$('#adml').prepend(el);}
async function show(id){const n=N[id];if(!n)return;const my=++tok;busy=true;pending=null;$('#ti').placeholder='Сообщение';
if(n.set)Object.assign(vars,n.set);
const msgs=Array.isArray(n.text)?n.text:[n.text];
for(const m of msgs){const ty=document.createElement('div');ty.className='typ';ty.innerHTML='<i></i><i></i><i></i>';chat.appendChild(ty);scroll();await wait(Math.min(900,350+String(m).length*6));if(my!==tok)return;ty.remove();bubble(m,'b');}
if(n.notify)notify(n);
if(n.buttons&&n.buttons.length){const kb=document.createElement('div');kb.className='kb';n.buttons.forEach(row=>{const r=document.createElement('div');r.className='row';row.forEach(b=>{const x=document.createElement('button');x.type='button';x.textContent=sub(b.t);x.onclick=()=>{if(busy)return;if(b.url){toast('В демо ссылка не открывается');return;}kbRemove();if(b.set)Object.assign(vars,b.set);bubble(b.t,'u');show(b.to);};r.appendChild(x);});kb.appendChild(r);});chat.appendChild(kb);scroll();}
if(n.ask){pending=n.ask;$('#ti').placeholder=n.ask.placeholder||'Введите ответ';$('#ti').focus({preventScroll:true});}
busy=false;}
function ok(a,v){if(a.type==='phone')return phoneOk(v);if(a.type==='number')return /^\d+$/.test(v.trim());return v.trim().length>0;}
$('#form').addEventListener('submit',async e=>{e.preventDefault();const v=$('#ti').value.trim();if(!v||busy)return;$('#ti').value='';bubble(v,'u');kbRemove();
if(/^\/start\b/i.test(v)){vars={};return show(C.start);}
if(pending){if(!ok(pending,v)){busy=true;await wait(400);bubble(pending.error||'Не получилось разобрать, попробуйте ещё раз.','b');busy=false;return;}
const a=pending;vars[a.key]=v;return show(a.next);}
busy=true;await wait(500);bubble(C.fallback||'Я пока понимаю только кнопки меню. Выберите пункт ниже.','b');busy=false;});
$('#menu').innerHTML=(C.menu||[]).map((b,i)=>'<button type="button" data-i="'+i+'">'+esc(b.t)+'</button>').join('');
$('#menu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||busy)return;const m=C.menu[b.dataset.i];kbRemove();bubble(m.t,'u');if(m.set)Object.assign(vars,m.set);show(m.to);});
function restart(){tok++;chat.innerHTML='';vars={};$('#adml').innerHTML='';$('#adm').classList.remove('on');bubble('/start','u');show(C.start);}
$('#rs').onclick=restart;
if(!(C.menu||[]).length)$('#menu').style.display='none';
reveal();demoPill();restart();
})();
</script>
</body>
