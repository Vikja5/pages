<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Клиника: выполняем ли план по приёмам и выручке — дашборд (демо)</title>
<meta name="description" content="Демо / пример работы: Клиника: выполняем ли план по приёмам и выручке">
<link rel="preload" href="fonts/Manrope-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Manrope-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Manrope";src:url("fonts/Manrope-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Manrope";src:url("fonts/Manrope-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:block}
@font-face{font-family:"Manrope";src:url("fonts/Manrope-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:"Manrope";src:url("fonts/Manrope-ExtraBold.woff2") format("woff2");font-weight:800 900;font-style:normal;font-display:block}
@font-face{font-family:"Manrope Fallback";src:local("Arial");size-adjust:104%}
:root{--accent:#2563eb;--accent2:#7c3aed;--bg:#fff;--fg:#0f172a;--mute:#5b6478;--card:#f4f6fb;--line:rgba(15,23,42,.12);--r:18px;--font:"Manrope","Manrope Fallback",Arial,sans-serif;--ease:cubic-bezier(.2,.7,.1,1);
--acc-soft:color-mix(in srgb,var(--accent) 12%,var(--bg));--acc-dark:color-mix(in srgb,var(--accent) 82%,#000)}
[data-theme=dark]{--bg:#0b1020;--fg:#eef1f8;--mute:#a1abc4;--card:#141b33;--line:rgba(255,255,255,.13)}
[data-radius=sharp]{--r:6px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.6;overflow-x:hidden}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(16px,4vw,36px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 26px;border-radius:calc(var(--r) * 3);border:2px solid transparent;background:linear-gradient(135deg,var(--accent),var(--acc-dark));color:#fff;font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s var(--ease),filter .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 38%,transparent);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);box-shadow:none;color:var(--accent)}
.btn.sm{min-height:42px;padding:8px 18px;font-size:.93rem}
.ico{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fld{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.fld input,.fld select,.fld textarea{width:100%;min-height:50px;padding:12px 14px;border-radius:calc(var(--r) * .7);border:1.5px solid var(--line);background:var(--bg);font-weight:400;font-size:1rem;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.fld.bad input{border-color:#d92d20}
.fld .err{color:#d92d20;font-weight:600;font-size:.85rem;min-height:1em}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--mute);cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.ok{display:none;padding:14px 16px;border-radius:calc(var(--r) * .7);background:color-mix(in srgb,#16a34a 14%,var(--bg));border:1.5px solid #16a34a;font-weight:600}
.ok.show{display:block;animation:pop .5s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0) * 70ms)}
.js .rv.in{opacity:1;transform:none}
.demo-pill{position:fixed;left:12px;bottom:12px;z-index:60;max-width:calc(100vw - 24px);padding:7px 14px;border-radius:999px;background:#111827;color:#fff;font-size:.78rem;font-weight:700;letter-spacing:.01em;box-shadow:0 6px 20px rgba(0,0,0,.28);pointer-events:none}
.demo-pill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#facc15;margin-right:8px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none}}
@media print{.demo-pill,.noprint{display:none!important}}

/* dash_bi: общий шаблон dash_oper / dash_strat / dash_anal. Спокойная палитра, один акцент, без 3D, шкал-спидометров и пирогов. */
:root{--accent:#2f6fdb;--page:#f4f5f7;--bg:#fff;--fg:#17202b;--mute:#5d6877;--faint:#7d8796;--line:rgba(23,32,43,.1);--g1:rgba(23,32,43,.06);--g2:rgba(23,32,43,.13);--g3:rgba(23,32,43,.22);--gbar:#aab2bd;--bad:#b4553a;--tip:#17202b;--tipfg:#fff;--r:14px;--card:var(--page)}
[data-theme=dark]{--page:#0e1217;--bg:#161b22;--fg:#e6eaf0;--mute:#9ba5b3;--faint:#7f8a99;--line:rgba(255,255,255,.09);--g1:rgba(255,255,255,.06);--g2:rgba(255,255,255,.12);--g3:rgba(255,255,255,.2);--gbar:#4d5765;--bad:#e2896b;--tip:#e6eaf0;--tipfg:#0e1217}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#0e1217;--bg:#161b22;--fg:#e6eaf0;--mute:#9ba5b3;--faint:#7f8a99;--line:rgba(255,255,255,.09);--g1:rgba(255,255,255,.06);--g2:rgba(255,255,255,.12);--g3:rgba(255,255,255,.2);--gbar:#4d5765;--bad:#e2896b;--tip:#e6eaf0;--tipfg:#0e1217}}
[data-radius=sharp]{--r:6px}
body{background:var(--page);font-size:16px;line-height:1.5}
.tn,.ban-v,td.n,.val{font-variant-numeric:tabular-nums lining-nums}
.top{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;gap:10px 16px;min-height:60px;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;min-width:0;flex:1 1 auto}
.brand svg{flex:none}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{flex:none;display:inline-flex;padding:3px;border-radius:999px;background:var(--g1);gap:2px}
.seg button{border:0;background:transparent;min-height:36px;padding:4px 13px;border-radius:999px;font-weight:700;font-size:.85rem;color:var(--mute);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.hero{padding-top:26px;padding-bottom:18px}
.kind{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.hero h1{font-size:clamp(1.4rem,3.3vw,2.05rem);line-height:1.2;font-weight:800;letter-spacing:-.015em;max-width:32em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin-top:8px;color:var(--mute);max-width:54em}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;font-size:.84rem;color:var(--mute)}
.live{display:inline-flex;align-items:center;gap:7px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
main.wrap{padding-bottom:40px;display:grid;gap:16px}
.bans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr));gap:12px}
@media (min-width:960px){.bans{grid-template-columns:repeat(var(--n,4),minmax(0,1fr))}}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.ban{display:flex;flex-direction:column;gap:6px;padding:16px 18px 12px}
.ban-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:.84rem;font-weight:700;color:var(--mute);line-height:1.3}
.why-b{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--faint);font-size:.75rem;font-weight:800;cursor:pointer;line-height:1;padding:0}
.why-b:hover{color:var(--accent);border-color:var(--accent)}
.ban-v{font-size:clamp(1.55rem,3vw,2.3rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.ban-d{font-size:.83rem;font-weight:700;color:var(--mute);line-height:1.35}
.ban-d small{font-weight:600;color:var(--faint);font-size:inherit}
.good{color:var(--accent)}.bad{color:var(--bad)}
.ban-p{display:grid;gap:5px;font-size:.8rem;color:var(--mute)}
.pbar{height:6px;border-radius:99px;background:var(--g1);position:relative;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:99px;transition:width .9s var(--ease)}
.spark{width:100%;height:34px;margin-top:auto;display:block}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.row.eq{grid-template-columns:repeat(2,minmax(0,1fr))}
.row.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:880px){.row,.row.eq{grid-template-columns:minmax(0,1fr)}}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{font-size:1rem;font-weight:800;line-height:1.3}
.ph small{color:var(--mute);font-size:.82rem}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart svg text{font-family:var(--font);fill:var(--faint);font-size:11px}
.tip{position:absolute;z-index:5;left:0;top:0;pointer-events:none;background:var(--tip);color:var(--tipfg);border-radius:8px;padding:6px 10px;font-size:.8rem;font-weight:700;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip small{display:block;font-weight:600;opacity:.75;font-size:.76rem}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.8rem;color:var(--mute);margin-top:10px}
.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--accent);vertical-align:middle;margin-right:6px}
.leg i.p{background:none;border-top:2px dashed var(--gbar);height:0}
.leg i.g{background:var(--gbar);height:9px;width:9px}
.leg i.t{background:var(--fg);height:2px}
/* очередь */
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--g1)}
.stack i{display:block;height:100%;transition:flex-grow .6s var(--ease)}
.ql{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:2px}
.ql li{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.ql li:first-child{border-top:0}
.ql s{width:10px;height:10px;border-radius:3px;display:block}
.ql b{font-size:1.15rem;font-weight:800;transition:color .4s}
.ql b.flash{color:var(--accent)}
.al{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.al li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border-radius:10px;background:var(--g1);font-size:.9rem;line-height:1.4}
.al li:before{content:"";width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--faint);grid-row:span 2}
.al li.lb:before{background:var(--bad)}.al li.la:before{background:var(--accent)}
.al time{font-size:.78rem;color:var(--faint)}
/* цели: bullet graph */
.bl-list{display:grid;gap:16px}
.bl-h{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:700;margin-bottom:6px;flex-wrap:wrap}
.bl-h span:last-child{color:var(--mute);font-weight:600}
.bl{position:relative;height:22px;border-radius:4px;overflow:hidden;background:var(--g1)}
.bl .bd1,.bl .bd2{position:absolute;top:0;bottom:0;left:0}
.bl .bd1{background:var(--g3)}.bl .bd2{background:var(--g2)}
.bl .fx{position:absolute;left:0;top:7px;height:8px;background:var(--accent);border-radius:0 3px 3px 0;transform-origin:left;animation:gx .9s var(--ease) both}
.bl .tg{position:absolute;top:3px;bottom:3px;width:3px;margin-left:-1px;background:var(--fg);border-radius:2px}
/* воронка */
.fn{display:grid;gap:4px}
.fn-r{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;align-items:center;gap:10px;font-size:.88rem;line-height:1.25;min-height:28px}
.fn-r span:first-child{overflow:hidden;text-overflow:ellipsis}
.fn-b{height:20px;border-radius:4px;background:var(--gbar);transform-origin:left;animation:gx .8s var(--ease) both}
.fn-r:first-child .fn-b{background:var(--accent)}
.fn-r b{font-weight:800;min-width:4.2em;text-align:right}
.fn-c{font-size:.78rem;color:var(--faint);padding-left:calc(min(9.5em,40%) + 10px)}
.fn-c.bad{color:var(--bad);font-weight:700}
/* срезы, причины */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{min-height:36px;padding:4px 13px;border-radius:99px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:.84rem;color:var(--mute);cursor:pointer;transition:.2s}
.chip:hover{color:var(--fg);border-color:var(--g3)}
.chip[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.hb{display:grid;gap:2px;position:relative}
.hb-r{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) auto;align-items:center;gap:10px;font-size:.88rem;padding:6px 6px;border-radius:8px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.hb-r:hover,.hb-r.sel{background:var(--g1)}
.hb-r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{position:relative;height:16px}
.hb-b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--gbar);transform-origin:left;animation:gx .7s var(--ease) both}
.hb-r.hi .hb-b{background:var(--accent)}
.hb-r b{font-weight:800;min-width:4.6em;text-align:right}
.hb-avg{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--faint)}
.ins{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--acc-soft);font-size:.9rem;line-height:1.45}
.ins b{color:var(--accent)}
.rs{display:grid;gap:2px}
.rs-r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;font-size:.88rem;padding:5px 0}
.rs-r .hb-t{grid-column:1/-1;height:8px}
.rs-r .hb-b{border-radius:99px}
.rs-r.hi .hb-b{background:var(--accent)}
.rs-r b{font-weight:800}
.rs-r small{color:var(--faint);min-width:4.4em;text-align:right}
/* когорты */
.ct{width:100%;border-collapse:separate;border-spacing:3px;font-size:.8rem}
.ct th{font-size:.72rem;font-weight:700;color:var(--faint);text-align:center;padding:2px;white-space:nowrap}
.ct th:first-child,.ct td:first-child{text-align:left}
.ct td{text-align:center;padding:7px 2px;border-radius:5px;font-weight:700;white-space:nowrap}
.ct td.lb{font-weight:700;color:var(--fg);padding-right:6px}
.ct td.sz{color:var(--mute);font-weight:600}
.ct td.lb,.ct td.sz,.ct th:nth-child(-n+2){width:1%;padding-right:12px}
.ct td.c{transition:background .4s}
.cw{overflow-x:auto}
/* подробности */
.more{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn.sm{min-height:42px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:14px}
.dt{border-collapse:collapse;width:100%;min-width:520px;font-size:.88rem}
.dt th{background:var(--g1);text-align:left;padding:10px 12px;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);cursor:pointer;white-space:nowrap;user-select:none}
.dt th[data-d]:after{content:attr(data-d);margin-left:5px;color:var(--accent)}
.dt td{padding:9px 12px;border-top:1px solid var(--line)}
.dt td.n{text-align:right;white-space:nowrap}
.dt tr.flag td{background:color-mix(in srgb,var(--bad) 9%,transparent)}
.dt tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.bdg{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--g1);font-weight:700;font-size:.78rem;white-space:nowrap}
.fl-note{font-size:.82rem;color:var(--mute);margin-top:10px}
.fl-note i{display:inline-block;width:10px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--bad) 30%,transparent);box-shadow:inset 3px 0 0 var(--bad);margin-right:6px;vertical-align:-1px}
/* откуда цифры */
.about summary{cursor:pointer;font-weight:800;list-style:none;display:flex;align-items:center;gap:10px;min-height:28px}
.about summary::-webkit-details-marker{display:none}
.about summary:before{content:"+";width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-weight:800;flex:none}
.about[open] summary:before{content:"−"}
.about ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.about li{padding:10px 12px;border-radius:10px;background:var(--g1);font-size:.88rem;display:grid;gap:2px;transition:box-shadow .3s}
.about li.hl{box-shadow:0 0 0 2px var(--accent)}
.about li span{color:var(--mute)}
.about p{margin-top:12px;font-size:.84rem;color:var(--faint)}
.foot{padding-top:6px;padding-bottom:80px;font-size:.82rem;color:var(--faint)}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dr{to{stroke-dashoffset:0}}
@media (max-width:520px){.panel{padding:16px 14px}.ban{padding:14px 14px 10px}.seg button{padding:4px 11px}.seg button span{display:none}.seg:before{content:"дней:";align-self:center;font-size:.78rem;font-weight:700;color:var(--faint);padding:0 4px 0 8px}.fn-r{grid-template-columns:minmax(0,7em) minmax(0,1fr) auto}.fn-c{padding-left:calc(7em + 10px)}.hb-r{grid-template-columns:minmax(0,6.6em) minmax(0,1fr) auto;gap:8px}.ct{font-size:.72rem;border-spacing:2px}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><div class="brand" id="brand"></div><div class="seg" id="seg" role="group" aria-label="Период"></div></div></header>
<section class="wrap hero"><div class="kind rv" id="kind"></div><h1 id="h1" class="rv"></h1><p id="sub" class="rv"></p><div class="meta rv" id="meta"></div></section>

o_note": "демо / пример работы, данные условные", "variant": "strat"}</script>
<script>

home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',chart:'<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-7"/>',
doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',

cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',pc:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
chat:'<path d="M4 5h16v11H9l-5 4z"/>',table:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M3 15h18M9 5v14"/>',code:'<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>'};

function logo(name,size){const l=esc((name||'D').replace(/[^A-Za-zЀ-ӿ0-9]/g,'').slice(0,1).toUpperCase()||'D');
return '<svg width="'+(size||38)+'" height="'+(size||38)+'" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#lg)"/><text x="20" y="27" text-anchor="middle" font-family="Manrope,Arial" font-weight="800" font-size="21" fill="#fff">'+l+'</text></svg>';}
function applyTheme(){const r=document.documentElement;
if(CFG.accent)r.style.setProperty('--accent',CFG.accent);
r.style.setProperty('--accent2',CFG.accent2||CFG.accent||'#7c3aed');
if(CFG.theme==='dark')r.setAttribute('data-theme','dark');
if(CFG.radius==='sharp')r.setAttribute('data-radius','sharp');}
function reveal(){const els=$$('.rv');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
els.forEach((e,i)=>{if(!e.style.getPropertyValue('--i'))e.style.setProperty('--i',i%4);io.observe(e);});
setTimeout(()=>els.forEach(e=>{if(e.getBoundingClientRect().top<innerHeight)e.classList.add('in');}),120);}
function download(name,mime,content){const b=new Blob(['﻿'+content],{type:mime+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const phoneOk=v=>/^\+?[0-9\s()\-]{10,}$/.test(String(v).trim());
function demoPill(){const d=document.createElement('div');d.className='demo-pill';d.innerHTML='<i></i>'+esc(CFG.demo_note||'демо / пример работы, данные условные');document.body.appendChild(d);}
function htmlDoc(title,body,extraCss){return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>'+esc(String(title).replace(/\*/g,''))+'</title><style>body{font-family:Arial,sans-serif;font-size:11pt;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:5px 8px;text-align:left}th{background:#e8e8e8}h1{font-size:18pt}h2{font-size:13pt}'+(extraCss||'')+'</style></head><body>'+body+'</body></html>';}
document.documentElement.classList.add('js');
applyTheme();

(function(){
const C=CFG,V=C.variant||'oper',ROOT=document.documentElement;
if(C.theme==='light')ROOT.setAttribute('data-theme','light');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const D=180,TODAY=new Date();TODAY.setHours(0,0,0,0);
const CUR=C.currency||'₽';
const MS=C.metrics||[],M={};MS.forEach(m=>M[m.id]=m);
let N=C.period_default||30,FIRST=true;
function rng(s){let a=(s|0)||1;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gen(m){const g=m.gen||{},r=rng(g.seed||7),b=+g.base||0,tr=(+g.trend||0)/100,no=(+g.noise||0)/100,wk=(+g.week||0)/100,o=[];
for(let i=0;i<D;i++){const d=new Date(TODAY);d.setDate(d.getDate()-(D-1-i));const wd=d.getDay();
let v=b*(1+tr*(i-(D-1))/90)*((wd===0||wd===6)?1-wk:1)*(1+no*(r()*2-1));v=Math.max(0,v);
if(g.min!=null)v=Math.max(g.min,v);if(g.max!=null)v=Math.min(g.max,v);if(g.int)v=Math.round(v);o.push(v);}return o;}
MS.forEach(m=>m.s=gen(m));
const day=i=>{const d=new Date(TODAY);d.setDate(d.getDate()-(D-1-i));return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');};
function agg(m,a,b){const s=m.s.slice(a,b);if(!s.length)return 0;if(m.agg==='last')return s[s.length-1];const t=s.reduce((x,y)=>x+y,0);return m.agg==='avg'?t/s.length:t;}
function cmp(v,d){const a=Math.abs(v);return a>=1e6?fmt(v/1e6,a>=1e7?1:2)+' млн':a>=1e5?fmt(v/1e3,0)+' тыс':fmt(v,d||0);}
function ax(v,top){if(top>=2e6)return fmt(v/1e6,v%1e6?1:0)+' млн';if(top>=2e4)return fmt(v/1e3,0)+' тыс';return fmt(v,top<10?1:0);}
function fv(m,v,c){const t=m.fmt||'num',d=m.dec!=null?m.dec:(t==='pct'?1:0);
if(t==='money')return (c?cmp(v):fmt(Math.round(v)))+' '+CUR;
if(t==='pct')return fmt(v,d)+' %';
if(t==='min'){v=Math.round(v);return v<60?v+' мин':Math.floor(v/60)+' ч '+String(v%60).padStart(2,'0')+' мин';}
return (c?cmp(v,d):fmt(v,d))+(m.unit?' '+m.unit:'');}
function per(m){return{cur:agg(m,D-N,D),prev:agg(m,D-2*N,D-N),plan:m.plan==null?null:(m.agg==='sum'?m.plan*N/30:m.plan)};}
function delta(m,cur,prev){if(!prev)return '';const p=m.fmt==='pct',d=p?cur-prev:(cur-prev)/Math.abs(prev)*100;
if(Math.abs(d)<.05)return '<span>→ без изменений</span> <small>к прошлым '+N+' дн.</small>';
const up=d>0,good=(m.good||'up')==='up'?up:!up;
return '<span class="'+(good?'good':'bad')+'">'+(up?'▲':'▼')+' '+fmt(Math.abs(d),1)+(p?' п.п.':' %')+'</span> <small>к прошлым '+N+' дн.</small>';}
function nice(v){if(!(v>0))return 1;v*=1.06;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;}
function countUp(el,m,to){const from=el._v==null?0:el._v;el._v=to;if(RM||from===to){el.textContent=fv(m,to,1);return;}
const t0=performance.now(),dur=FIRST?1100:600;(function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fv(m,from+(to-from)*e,1);if(k<1)requestAnimationFrame(f);})(t0);}
const P=(id,title,body,small,cls)=>'<section class="panel rv'+(cls?' '+cls:'')+'" id="'+id+'"><div class="ph"><h2>'+esc(title||'')+'</h2><small id="'+id+'-s">'+(small||'')+'</small></div>'+body+'</section>';
function row(items,cls){items=items.filter(Boolean);if(!items.length)return '';return '<div class="row'+(items.length===1?' one':cls?' '+cls:'')+'">'+items.join('')+'</div>';}
function tipOn(box,x,y,html){let t=box.querySelector('.tip');if(!t){t=document.createElement('div');t.className='tip';box.appendChild(t);}
t.innerHTML=html;const w=box.clientWidth,tw=t.offsetWidth||120;const cx=Math.max(tw/2,Math.min(w-tw/2,x));t.style.left=cx+'px';t.style.top=y+'px';t.classList.add('on');}
function tipOff(box){const t=box.querySelector('.tip');if(t)t.classList.remove('on');}
function hoverBars(box){box.querySelectorAll('[data-t]').forEach(el=>{const show=()=>{const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();tipOn(box,r.left+r.width/2-b.left,r.top-b.top,esc(el.getAttribute('data-t')));};
el.addEventListener('pointerenter',show);el.addEventListener('pointerdown',show);el.addEventListener('pointerleave',()=>tipOff(box));});}

$('#brand').innerHTML=logo(C.brand||C.title)+'<span>'+esc(C.brand||'')+'</span>';
const KIND={oper:'Оперативный дашборд · что происходит сейчас',strat:'Стратегический дашборд · идём ли к цели',anal:'Аналитический дашборд · почему так'};

else a.push('<span>Данные на '+day(D-1)+'</span>');a.push('<span>Период: последние '+N+' дн.</span>');if(C.niche)a.push('<span>'+esc(C.niche)+'</span>');a.push('<span>'+esc(C.demo_note||'демо / пример работы, данные условные')+'</span>');$('#meta').innerHTML=a.join('');}

/* ---------- BAN: крупные цифры ---------- */
const BAN=(C.ban||[]).filter(id=>M[id]);
const banHTML='<div class="bans" style="--n:'+BAN.length+'">'+BAN.map(id=>{const m=M[id];return '<article class="panel ban rv" data-m="'+id+'"><div class="ban-h"><span>'+esc(m.label)+'</span>'+(m.src||m.formula?'<button class="why-b" type="button" data-why="'+id+'" aria-label="Откуда цифра: '+esc(m.label)+'" title="Откуда цифра">?</button>':'')+'</div><b class="ban-v">0</b><div class="ban-d"></div>'+(m.plan!=null?'<div class="ban-p"><span class="tn"></span>'+((m.good||'up')==='up'?'<div class="pbar"><i></i></div>':'')+'</div>':'')+'<svg class="spark" aria-hidden="true"></svg></article>';}).join('')+'</div>';
function drawBans(){BAN.forEach(id=>{const m=M[id],el=$('.ban[data-m="'+id+'"]'),p=per(m);countUp($('.ban-v',el),m,p.cur);$('.ban-d',el).innerHTML=delta(m,p.cur,p.prev);
if(p.plan!=null){const s=$('.ban-p span',el);if((m.good||'up')==='down'){const ok=p.cur<=p.plan;s.innerHTML='цель ≤ '+fv(m,p.plan,1)+' · <b class="'+(ok?'good':'bad')+'">'+(ok?'в норме':'выше цели')+'</b>';}
else{const k=p.plan?p.cur/p.plan*100:0;s.innerHTML=(m.plan_label||'план')+' '+fv(m,p.plan,1)+' · <b class="'+(k>=100?'good':'')+'">'+fmt(k,0)+' %</b>';const b=$('.pbar i',el);if(b)setTimeout(()=>b.style.width=Math.min(100,k)+'%',FIRST?300:0);}}
spark($('.spark',el),m);});}
function spark(svg,m){const w=svg.clientWidth||160,h=34,s=m.s.slice(D-N),mn=Math.min(...s),mx=Math.max(...s),rg=mx-mn||1;
const x=i=>2+i*(w-6)/(s.length-1),y=v=>3+(h-6)*(1-(v-mn)/rg);
svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.innerHTML='<path d="M'+s.map((v,i)=>x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' L')+'" fill="none" stroke="var(--gbar)" stroke-width="1.5" stroke-linejoin="round"/><circle cx="'+x(s.length-1)+'" cy="'+y(s[s.length-1])+'" r="3" fill="var(--accent)"/>';}

/* ---------- линия: динамика к прошлому периоду ---------- */
const TR=C.trend&&M[C.trend.metric]?C.trend:null;
function drawTrend(){if(!TR)return;const box=$('#trend .chart');if(!box)return;const m=M[TR.metric],cur=m.s.slice(D-N),prev=m.s.slice(D-2*N,D-N);
$('#trend-s').textContent=fv(m,per(m).cur,1)+' за '+N+' дн.';
const W=box.clientWidth||600,H=W<520?200:250,L=46,Rr=10,T=12,B=26,iw=W-L-Rr,ih=H-T-B,top=nice(Math.max(...cur,...prev));
