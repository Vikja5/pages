.ok.show{display:block;animation:pop .5s var(--ease)}

.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0) * 70ms)}

$('#brand').innerHTML=logo(C.brand||C.title)+'<span>'+esc(C.brand||C.title)+'</span>';
$('#kind').textContent=C.kind||'Документ';
$('#h1').innerHTML=String(C.title).split('*').map((w,i)=>i%2?'<em>'+esc(w)+'</em>':esc(w)).join('');
$('#sub').textContent=C.subtitle||'';
$('#fh').textContent=C.form_title||'Данные документа';
$('#flds').innerHTML=F.map(f=>{const id='f_'+f.id;
if(f.type==='select')return '<label class="fld"><span>'+esc(f.label)+'</span><select id="'+id+'">'+f.options.map(o=>'<option'+(o===v[f.id]?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></label>';
if(f.type==='textarea')return '<label class="fld"><span>'+esc(f.label)+'</span><textarea id="'+id+'">'+esc(v[f.id])+'</textarea></label>';
return '<label class="fld"><span>'+esc(f.label)+(f.hint?' <span class="h">'+esc(f.hint)+'</span>':'')+'</span><input id="'+id+'" type="'+(f.type==='number'?'number':f.type==='date'?'date':'text')+'" value="'+esc(v[f.id])+'"></label>';}).join('');
const show=(f,val)=>{if(f.type==='date'&&val){const p=String(val).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:val;}if(f.type==='number'&&val!=='')return fmt(Number(val));return val===''||val==null?'—':val;};
const fill=(s,hl)=>esc(s).replace(/\{(\w+)\}/g,(m,k)=>{const f=F.find(x=>x.id===k);if(!f)return m;const t=esc(show(f,v[k]));return hl?'<mark>'+t+'</mark>':t;});
const sum=i=>(Number(i.qty)||0)*(Number(i.price)||0);
function tableHtml(ed){if(!TB)return '';const cl=TB.columns||{},net=items.reduce((a,i)=>a+sum(i),0),vat=TB.vat?net*TB.vat/100:0;
let h=(TB.title?'<h3>'+esc(TB.title)+'</h3>':'')+'<div class="tw"><table><thead><tr><th>'+esc(cl.name||'Наименование')+'</th><th>'+esc(cl.unit||'Ед.')+'</th><th class="n">'+esc(cl.qty||'Кол-во')+'</th><th class="n">'+esc(cl.price||'Цена')+'</th><th class="n">'+esc(cl.sum||'Сумма')+'</th>'+(ed?'<th></th>':'')+'</tr></thead><tbody>';
items.forEach((i,k)=>{h+='<tr><td>'+esc(i.name)+'</td><td>'+esc(i.unit||'шт')+'</td><td class="n">'+(ed?'<input type="number" min="0" data-k="'+k+'" data-p="qty" value="'+i.qty+'" aria-label="Количество">':fmt(Number(i.qty),2))+'</td><td class="n">'+(ed?'<input type="number" min="0" data-k="'+k+'" data-p="price" value="'+i.price+'" aria-label="Цена">':fmt(Number(i.price)))+'</td><td class="n">'+fmt(sum(i))+' '+cur+'</td>'+(ed?'<td><button type="button" data-del="'+k+'" aria-label="Удалить строку">×</button></td>':'')+'</tr>';});
h+='</tbody></table></div>'+(ed&&TB.add!==false?'<button type="button" class="add" id="add">+ Добавить строку</button>':'');
h+='<div class="tw"><table class="tot" style="min-width:0;margin-left:auto;width:auto"><tbody>'+(TB.vat?'<tr><td>Сумма без НДС</td><td class="n">'+fmt(net)+' '+cur+'</td></tr><tr><td>НДС '+TB.vat+' %</td><td class="n">'+fmt(vat)+' '+cur+'</td></tr>':'')+'<tr><td>'+esc(TB.total_label||'Итого')+'</td><td class="n">'+fmt(net+vat)+' '+cur+'</td></tr></tbody></table></div>';return h;}
function paper(ed){let tdone=false;let h='<div class="ph"><div class="b">'+logo(C.brand||C.title,30)+'<span>'+esc(C.brand||'')+'</span></div><div class="d">'+esc(C.demo_note||'демо / пример работы, данные условные')+'</div></div>';
h+='<h2 class="t">'+fill(C.paper_title||C.title.replace(/\*/g,''),ed)+'</h2>';
(C.blocks||[]).forEach(b=>{if(b.table){h+=tableHtml(ed);tdone=true;return;}if(b.h)h+='<h3>'+fill(b.h,ed)+'</h3>';(Array.isArray(b.p)?b.p:[b.p||'']).forEach(p=>{if(p)h+='<p>'+fill(p,ed)+'</p>';});});
if(TB&&!tdone)h+=tableHtml(ed);
if(C.sign)h+='<div class="sg">'+C.sign.map(s=>'<div>'+fill(s,ed)+'</div>').join('')+'</div>';return h;}
function draw(){const a=document.activeElement,id=a&&a.dataset&&a.dataset.k!=null?[a.dataset.k,a.dataset.p]:null;$('#paper').innerHTML=paper(true);if(id){const n=$('#paper input[data-k="'+id[0]+'"][data-p="'+id[1]+'"]');if(n){n.focus();n.setSelectionRange&&0;}}}
$('#flds').addEventListener('input',e=>{const f=F.find(x=>'f_'+x.id===e.target.id);if(!f)return;v[f.id]=e.target.value;draw();});
$('#paper').addEventListener('input',e=>{const t=e.target;if(t.dataset.k==null)return;items[t.dataset.k][t.dataset.p]=Number(t.value)||0;const keep=[t.dataset.k,t.dataset.p];draw();const n=$('#paper input[data-k="'+keep[0]+'"][data-p="'+keep[1]+'"]');if(n){n.focus();const l=n.value.length;try{n.setSelectionRange(l,l);}catch(x){}}});
$('#paper').addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d){items.splice(Number(d.dataset.del),1);draw();return;}if(e.target.id==='add'){items.push({name:TB.new_name||'Новая позиция',unit:'шт',qty:1,price:0});draw();}});
const plain=()=>{const t=document.createElement('div');t.innerHTML=paper(false);return t.innerHTML.replace(/<svg[\s\S]*?<\/svg>/g,'');};
const rowsX=()=>[[(TB.columns||{}).name||'Наименование',(TB.columns||{}).unit||'Ед.',(TB.columns||{}).qty||'Кол-во',(TB.columns||{}).price||'Цена',(TB.columns||{}).sum||'Сумма']].concat(items.map(i=>[i.name,i.unit||'шт',i.qty,i.price,sum(i)]));
const EX=[['PDF','download',()=>{$('#sheet').innerHTML='<article class="paper">'+paper(false)+'</article>';window.print();},1],
['DOC','doc',()=>download((C.file||'document')+'.doc','application/msword',htmlDoc(C.title,plain())),0]];
if(TB&&C.export_xls!==false)EX.push(['XLS','table',()=>download((C.file||'document')+'.xls','application/vnd.ms-excel',htmlDoc(C.title,'<h1>'+esc((C.paper_title||C.title).replace(/\*/g,'').replace(/\{(\w+)\}/g,(m,k)=>v[k]||''))+'</h1><table>'+rowsX().map((r,i)=>'<tr>'+r.map(c=>'<'+(i?'td':'th')+'>'+esc(c)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table><p>'+esc(C.demo_note||'')+'</p>')),0]);
$('#exp').innerHTML=EX.map((x,i)=>'<button type="button" class="'+(x[3]?'p':'')+'" data-i="'+i+'">'+ico(x[1])+'Скачать '+x[0]+'</button>').join('');
$('#exp').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)EX[b.dataset.i][2]();});
draw();reveal();demoPill();
})();
</script>
</body>
</html>
