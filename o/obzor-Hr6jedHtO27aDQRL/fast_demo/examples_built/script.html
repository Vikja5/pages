d):\n            key = (item[\"title\"], item[\"price\"])\n            if dedupe and key in seen:\n                continue\n            seen.add(key)\n            rows.append(item)\n    with open(\"result.csv\", \"w\", newline=\"\", encoding=\"utf-8-sig\") as f:\n        w = csv.DictWriter(f, fieldnames=[\"title\", \"price\", \"city\"], delimiter=\";\")\n        w.writeheader()\n        w.writerows(rows)\n    print(f\"Сохранено строк: {len(rows)}\")\n\nif __name__ == \"__main__\":\n    main()\n", "cmd": "python collect_catalog.py --keyword \"{keyword}\" --pages {pages}"}, "log": [{"t": "[INFO] Запуск, ключевое слово: «{keyword}», страниц: {pages}", "d": 400}, {"t": "[INFO] Подключение к каталогу... ответ 200", "d": 600, "lvl": "ok"}, {"t": "[INFO] Страница 1: найдено 24 карточки", "d": 600}, {"t": "[INFO] Страница 2: найдено 24 карточки", "d": 600}, {"t": "[WARN] Страница 2: у 1 карточки нет цены, пропущена", "d": 500, "lvl": "warn"}, {"t": "[INFO] Страница 3: найдено 18 карточек", "d": 600}, {"t": "[INFO] Дубли убраны (режим: {dedupe}), осталось 62 строки", "d": 700}, {"t": "[OK] Файл result.csv сохранён, 62 строки", "d": 500, "lvl": "ok"}], "result": {"title": "Результат по запросу «{keyword}»", "file": "result.csv", "summary": ["Строк в файле: 62 (на экране первые 6)", "Страниц: {pages}", "Дубли убирать: {dedupe}"], "columns": ["Название", "Цена, ₽", "Город"], "rows": [["Кофемашина автоматическая, модель A", "24 900", "Казань"], ["Кофемашина капсульная, модель B", "8 300", "Москва"], ["Кофемашина рожковая, модель C", "15 700", "Самара"], ["Кофемашина автоматическая, модель D", "31 200", "Казань"], ["Кофемашина капсульная, модель E", "6 900", "Уфа"], ["Кофемашина рожковая, модель F", "12 400", "Москва"]]}, "demo_note": "демо / пример работы, данные условные"}</script>

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
els.forEach((e,i)=>{if(!e.style.getPropertyValue('--i'))e.style.setProperty('--i',i%4);io.observe(e);});
setTimeout(()=>els.forEach(e=>{if(e.getBoundingClientRect().top<innerHeight)e.classList.add('in');}),120);}
function download(name,mime,content){const b=new Blob(['﻿'+content],{type:mime+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const phoneOk=v=>/^\+?[0-9\s()\-]{10,}$/.test(String(v).trim());
function demoPill(){const d=document.createElement('div');d.className='demo-pill';d.innerHTML='<i></i>'+esc(CFG.demo_note||'демо / пример работы, данные условные');document.body.appendChild(d);}
function htmlDoc(title,body,extraCss){return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>'+esc(String(title).replace(/\*/g,''))+'</title><style>body{font-family:Arial,sans-serif;font-size:11pt;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:5px 8px;text-align:left}th{background:#e8e8e8}h1{font-size:18pt}h2{font-size:13pt}'+(extraCss||'')+'</style></head><body>'+body+'</body></html>';}
document.documentElement.classList.add('js');
applyTheme();

(function(){
const C=CFG,S=C.script,P=C.params||[],R=C.result;
$('#brand').innerHTML=logo(C.brand||C.title)+'<span>'+esc(C.brand||C.title)+'</span>';
$('#kind').textContent=C.kind||'Скрипт';
$('#h1').innerHTML=String(C.title).split('*').map((w,i)=>i%2?'<em>'+esc(w)+'</em>':esc(w)).join('');
$('#sub').textContent=C.subtitle||'';
$('#pipe').innerHTML=(C.pipeline||[]).map((p,i)=>'<div class="rv">'+ico(p.icon,i+8)+'<span>'+esc(p.title)+(p.text?'<small>'+esc(p.text)+'</small>':'')+'</span></div>').join('');
$('#ph').textContent=C.params_title||'Параметры запуска';
$('#pf').innerHTML=P.map(p=>p.type==='toggle'?'<label class="tg"><input type="checkbox" id="p_'+p.id+'"'+(p.default?' checked':'')+'><i></i><span>'+esc(p.label)+'</span></label>':p.type==='select'?'<label class="fld"><span>'+esc(p.label)+'</span><select id="p_'+p.id+'">'+p.options.map(o=>'<option'+(o===p.default?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></label>':'<label class="fld"><span>'+esc(p.label)+'</span><input id="p_'+p.id+'" type="'+(p.type==='number'?'number':'text')+'" value="'+esc(p.default!=null?p.default:'')+'"></label>').join('');
$('#go').innerHTML=ico('play')+esc(C.run_button||'Запустить скрипт');
$('#dl').innerHTML=ico('download')+esc(C.download_button||'Скачать скрипт');
$('#csv').textContent='Скачать '+((R&&R.file)||'result.csv');
$('#fn').textContent=S.file;
const KW=new RegExp('^(?:'+(S.keywords||['def','import','from','for','in','if','elif','else','return','with','as','try','except','while','class','not','and','or','True','False','None','function','param','foreach','Write-Host']).join('|')+')$');
function hl(line){let out='',re=/(#.*$|\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|([A-Za-z_][\w-]*)|(\d+\.?\d*)/g,i=0,m;
while((m=re.exec(line))){out+=esc(line.slice(i,m.index));i=re.lastIndex;
if(m[1])out+='<span class="c">'+esc(m[1])+'</span>';else if(m[2])out+='<span class="s">'+esc(m[2])+'</span>';else if(m[3])out+=KW.test(m[3])?'<span class="k">'+esc(m[3])+'</span>':esc(m[3]);else out+='<span class="nm">'+esc(m[4])+'</span>';}
return out+esc(line.slice(i));}
$('#code').innerHTML=S.code.split('\n').map(l=>'<div>'+(hl(l)||' ')+'</div>').join('');
const val=()=>{const o={};P.forEach(p=>{const e=$('#p_'+p.id);o[p.id]=p.type==='toggle'?(e.checked?'да':'нет'):e.value;});return o;};
const sub=(s,o)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null&&o[k]!==''?o[k]:'—');
let run=0;
$('#go').onclick=async()=>{const my=++run,o=val(),T=$('#term');$('#go').disabled=true;$('#res').classList.remove('on');T.innerHTML='';
const add=(t,c)=>{const d=document.createElement('div');d.className=c;d.textContent=t;T.appendChild(d);T.scrollTop=T.scrollHeight;return d;};
const cmd=add('> '+(S.cmd||('python '+S.file)).replace(/\{(\w+)\}/g,(m,k)=>o[k]||''),'l-cmd');
for(const l of C.log){await new Promise(r=>setTimeout(r,l.d||350));if(my!==run)return;add(sub(l.t,o),'l-'+(l.lvl||'info'));}
$('#go').disabled=false;drawRes(o);setTimeout(()=>$('#res').scrollIntoView({behavior:'smooth',block:'start'}),200);};
function drawRes(o){if(!R)return;$('#rt').textContent=sub(R.title||'Результат',o);
$('#sum').innerHTML=(R.summary||[]).map(s=>'<span>'+esc(sub(s,o))+'</span>').join('');
$('#th').innerHTML='<tr>'+R.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
$('#tb').innerHTML=R.rows.map((r,i)=>'<tr style="animation-delay:'+i*50+'ms">'+r.map(c=>'<td>'+esc(sub(c,o))+'</td>').join('')+'</tr>').join('');
$('#res').classList.add('on');}
const tbl=()=>[R.columns].concat(R.rows.map(r=>r.map(c=>sub(c,val()))));
$('#csv').onclick=()=>download(R.file||'result.csv','text/csv',tbl().map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'));
$('#xls').onclick=()=>download((R.file||'result').replace(/\.\w+$/,'')+'.xls','application/vnd.ms-excel',htmlDoc(C.title,'<h1>'+esc(C.title.replace(/\*/g,''))+'</h1><table>'+tbl().map((r,i)=>'<tr>'+r.map(c=>'<'+(i?'td':'th')+'>'+esc(c)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table><p>'+esc(C.demo_note||'')+'</p>'));
$('#dl').onclick=()=>download(S.file,'text/plain','# '+(C.demo_note||'демо / пример работы, данные условные')+'\n'+S.code);
reveal();demoPill();
})();
</script>
</body>
</html>
