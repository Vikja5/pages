if(CFG.theme==='dark')r.setAttribute('data-theme','dark');
if(CFG.radius==='sharp')r.setAttribute('data-radius','sharp');}
function reveal(){const els=$$('.rv');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
els.forEach((e,i)=>{if(!e.style.getPropertyValue('--i'))e.style.setProperty('--i',i%4);io.observe(e);});
setTimeout(()=>els.forEach(e=>{if(e.getBoundingClientRect().top<innerHeight)e.classList.add('in');}),120);}
function download(name,mime,content){const b=new Blob(['﻿'+content],{type:mime+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const phoneOk=v=>/^\+?[0-9\s()\-]{10,}$/.test(String(v).trim());
function demoPill(){const d=document.createElement('div');d.className='demo-pill';d.innerHTML='<i></i>'+esc(CFG.demo_note||'демо / пример работы, данные условные');document.body.appendChild(d);}
function htmlDoc(title,body,extraCss){return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>'+esc(String(title).replace(/\*/g,''))+'</title><style>body{font-family:Arial,sans-serif;font-size:11pt;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:5px 8px;text-align:left}th{background:#e8e8e8}h1{font-size:18pt}h2{font-size:13pt}'+(extraCss||'')+'</style></head><body>'+body+'</body></html>';}
document.documentElement.classList.add('js');
applyTheme();

(function(){
const C=CFG,cols=C.columns,rows0=C.rows;
const PAL=['#2563eb','#0f766e','#c2410c','#7c3aed','#be123c','#4d7c0f','#0369a1','#a16207'];
const ci=k=>cols.findIndex(c=>c.key===k);
$('#brand').innerHTML=logo(C.brand||C.title)+'<span>'+esc(C.brand||C.title)+'</span>';
$('#per').textContent=C.period_label||'';
$('#h1').innerHTML=String(C.title).split('*').map((w,i)=>i%2?'<em>'+esc(w)+'</em>':esc(w)).join('');
$('#sub').textContent=C.subtitle||'';
let sortK=null,sortD=1,fv='',q='';
const fcol=C.filter?ci(C.filter.col):-1;
function fm(c,v){if(v==null||v==='')return '';if(c.type==='money')return fmt(Number(v))+' ₽';if(c.type==='pct')return fmt(Number(v),1)+' %';if(c.type==='num')return fmt(Number(v),c.dec||0);return String(v);}
function data(){return rows0.filter(r=>(!fv||r[fcol]===fv)&&(!q||r.join(' ').toLowerCase().includes(q)));}
function kv(k,d){const c=cols[ci(k.col)];let vals=k.agg==='count'?d.map(()=>1):d.map(r=>Number(r[ci(k.col)])||0);
let v=0;if(k.agg==='sum'||k.agg==='count')v=vals.reduce((a,b)=>a+b,0);else if(k.agg==='avg')v=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;else if(k.agg==='max')v=vals.length?Math.max(...vals):0;else if(k.agg==='min')v=vals.length?Math.min(...vals):0;
const t=k.fmt||(c&&c.type)||'num';return t==='money'?fmt(v)+' ₽':t==='pct'?fmt(v,1)+' %':fmt(v,k.dec||0)+(k.suffix?' '+k.suffix:'');}
let kBuilt=false;
function drawK(d){if(!kBuilt){$('#kpis').innerHTML=(C.kpis||[]).map((k,i)=>'<div class="box kpi rv"><small>'+esc(k.label)+'</small><b data-k="'+i+'"></b></div>').join('');kBuilt=true;reveal();}
(C.kpis||[]).forEach((k,i)=>{$('[data-k="'+i+'"]').textContent=kv(k,d);});}
function group(d){const x=ci(C.chart.x),y=ci(C.chart.y),m=new Map();d.forEach(r=>{m.set(r[x],(m.get(r[x])||0)+(Number(r[y])||0));});return [...m.entries()];}
function drawC(d){if(!C.chart)return;const g=group(d),W=640,H=280,P={l:44,r:12,t:14,b:34},iw=W-P.l-P.r,ih=H-P.t-P.b;
const max=Math.max(1,...g.map(a=>a[1])),mag=Math.pow(10,Math.floor(Math.log10(max)))/2,top=Math.ceil(max*1.05/mag)*mag;
const yy=v=>P.t+ih-(v/top)*ih,n=Math.max(1,g.length);let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(C.chart.title||'График')+'"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>';
for(let i=0;i<=4;i++){const v=top*i/4,y=yy(v);s+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(P.l-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+esc(short(v))+'</text>';}
const px=i=>C.chart.kind==='line'?P.l+(n===1?iw/2:i*iw/(n-1)):P.l+(i+.5)*iw/n;
if(C.chart.kind==='line'){const pts=g.map((a,i)=>[px(i),yy(a[1])]);let p='M'+pts.map(a=>a.join(' ')).join(' L ');s+='<path d="'+p+' L '+pts[pts.length-1][0]+' '+(P.t+ih)+' L '+pts[0][0]+' '+(P.t+ih)+'Z" fill="url(#ga)"/><path d="'+p+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s var(--ease) forwards"/>';
pts.forEach((a,i)=>{s+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="5" fill="var(--bg)" stroke="var(--accent)" stroke-width="3" data-t="'+esc(g[i][0]+': '+short(g[i][1],1))+'"/><circle cx="'+a[0]+'" cy="'+a[1]+'" r="16" fill="transparent" data-t="'+esc(g[i][0]+': '+fmt(g[i][1]))+'"/>';});}
else{const bw=Math.min(54,iw/n*.62);g.forEach((a,i)=>{const h=ih-(yy(a[1])-P.t);s+='<rect x="'+(px(i)-bw/2)+'" y="'+yy(a[1])+'" width="'+bw+'" height="'+h+'" rx="7" fill="url(#gb)" data-t="'+esc(a[0]+': '+fmt(a[1]))+'" style="transform-origin:'+px(i)+'px '+(P.t+ih)+'px;animation:gr .8s var(--ease) both;animation-delay:'+(i*60)+'ms"/>';});}
g.forEach((a,i)=>{if(n<=8||i%Math.ceil(n/8)===0)s+='<text x="'+px(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--mute)">'+esc(String(a[0]).slice(0,12))+'</text>';});
$('#chart').innerHTML=s+'</svg><div class="tip" id="tip"></div>';
$('#ct').textContent=C.chart.title||'';
const tip=$('#tip'),box=$('#chart');
$$('[data-t]',box).forEach(el=>{el.addEventListener('mouseenter',()=>{const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();tip.textContent=el.dataset.t;tip.style.left=(r.left+r.width/2-b.left)+'px';tip.style.top=(r.top-b.top)+'px';tip.classList.add('on');});el.addEventListener('mouseleave',()=>tip.classList.remove('on'));});
// легенда: доля по категориям
const tot=g.reduce((a,b)=>a+b[1],0)||1,srt=g.slice().sort((a,b)=>b[1]-a[1]).slice(0,6);
$('#lt').textContent=C.legend_title||'Доли';
$('#legend').innerHTML=srt.map(a=>'<div class="lg"><div><span>'+esc(a[0])+'</span><span>'+fmt(a[1]/tot*100)+' %</span></div><i style="--w:'+(a[1]/tot*100)+'%"></i></div>').join('');}
function short(v,d){return v>=1e6?fmt(v/1e6,1)+' млн':v>=1e4?fmt(v/1e3,d?1:0)+' тыс':fmt(v);}
function drawT(d){let a=d.slice();if(sortK!=null){const i=ci(sortK),num=['num','money','pct'].includes(cols[i].type);a.sort((x,y)=>(num?(Number(x[i])-Number(y[i])):String(x[i]).localeCompare(String(y[i]),'ru'))*sortD);}
$('#th').innerHTML='<tr>'+cols.map(c=>'<th data-k="'+c.key+'"'+(sortK===c.key?' data-d="'+(sortD>0?'↑':'↓')+'"':'')+'>'+esc(c.label)+'</th>').join('')+'</tr>';
$('#tb').innerHTML=a.map(r=>'<tr>'+cols.map((c,i)=>{const v=r[i];if(c.type==='badge'){const k=[...String(v)].reduce((s,ch)=>s+ch.charCodeAt(0),0)%PAL.length;return '<td><span class="bd" style="background:color-mix(in srgb,'+PAL[k]+' 16%,var(--bg));color:'+PAL[k]+'">'+esc(v)+'</span></td>';}return '<td'+(['num','money','pct'].includes(c.type)?' class="n"':'')+'>'+esc(fm(c,v))+'</td>';}).join('')+'</tr>').join('')||'<tr><td colspan="'+cols.length+'">Ничего не найдено</td></tr>';
$('#cnt').textContent='Записей: '+a.length+' из '+rows0.length;
$$('#th th').forEach(th=>th.onclick=()=>{if(sortK===th.dataset.k)sortD=-sortD;else{sortK=th.dataset.k;sortD=1;}drawT(data());});}
function all(){const d=data();drawK(d);drawC(d);drawT(d);}
if(fcol>=0){const vs=[...new Set(rows0.map(r=>r[fcol]))];$('#chips').innerHTML=['<button class="chip on" data-v="">Все</button>'].concat(vs.map(v=>'<button class="chip" data-v="'+esc(v)+'">'+esc(v)+'</button>')).join('');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;fv=b.dataset.v;$$('.chip').forEach(c=>c.classList.toggle('on',c===b));all();};}
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();all();};
const tbl=d=>[cols.map(c=>c.label)].concat(d.map(r=>r.map((v,i)=>fm(cols[i],v))));
$('#csv').onclick=()=>download((C.file||'data')+'.csv','text/csv',tbl(data()).map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'));
$('#xls').onclick=()=>download((C.file||'data')+'.xls','application/vnd.ms-excel',htmlDoc(C.title,'<h1>'+esc(C.title.replace(/\*/g,''))+'</h1><p>'+esc(C.demo_note||'демо / пример работы, данные условные')+'</p><table>'+tbl(data()).map((r,i)=>'<tr>'+r.map(v=>'<'+(i?'td':'th')+'>'+esc(v)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table>'));
// блок запуска
const R=C.run;
if(R){const run=$('#run');run.hidden=false;$('#board').classList.add('hide');
run.innerHTML='<h2>'+esc(R.title||'Параметры запуска')+'</h2><div class="params">'+(R.params||[]).map(p=>p.type==='toggle'?'<label class="tg"><input type="checkbox" id="p_'+p.id+'"'+(p.default?' checked':'')+'><i></i><span>'+esc(p.label)+'</span></label>':p.type==='select'?'<label class="fld"><span>'+esc(p.label)+'</span><select id="p_'+p.id+'">'+p.options.map(o=>'<option'+(o===p.default?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></label>':'<label class="fld"><span>'+esc(p.label)+'</span><input id="p_'+p.id+'" value="'+esc(p.default||'')+'"></label>').join('')+'</div><div><button class="btn" id="go" type="button">'+ico('play')+esc(R.button||'Запустить')+'</button></div><div class="prog" id="prog"><div class="bar2"><i id="pb"></i></div><div class="stp" id="stp"></div><p id="pm" style="font-weight:700"></p></div>';
$('#go').onclick=()=>{const st=R.steps||['Сбор','Выгрузка'];$('#prog').classList.add('on');$('#go').disabled=true;$('#stp').innerHTML=st.map(s=>'<span>'+esc(s)+'</span>').join('');let i=0;
(function step(){const sp=$$('#stp span');sp.forEach((s,k)=>s.className=k<i?'done':k===i?'on':'');$('#pb').style.width=Math.round(i/st.length*100)+'%';
if(i>=st.length){$('#pb').style.width='100%';$('#pm').textContent=(R.done||'Готово: найдено {n} записей').replace('{n}',rows0.length);$('#go').disabled=false;$('#go').lastChild.textContent=R.again||'Запустить ещё раз';$('#board').classList.remove('hide');all();setTimeout(()=>$('#board').scrollIntoView({behavior:'smooth',block:'start'}),150);return;}
i++;setTimeout(step,R.step_ms||650);})();};}
else all();
reveal();demoPill();
})();
</script>
<style>@keyframes dr{to{stroke-dashoffset:0}}@keyframes gr{from{transform:scaleY(0)}to{transform:scaleY(1)}}</style>
</body>
</html>
