<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Правка текста на плакате: демо</title>
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#0e1520;color:#fff;font-family:Segoe UI,Arial,sans-serif;min-height:100vh;padding:14px 16px}
h1{font-size:18px;margin:0 0 4px;text-align:center}
p.s{margin:0 0 12px;text-align:center;color:#9fb0c8;font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:900px;margin:0 auto}
figure{margin:0}
img{width:100%;height:auto;display:block;border-radius:6px}
figcaption{text-align:center;font-weight:700;font-size:13px;padding:6px 0;letter-spacing:.06em;text-transform:uppercase}
.b figcaption{color:#9fb0c8}.a figcaption{color:#ff5a5f}
</style></head><body>
<h1>Демо: пример работы по вашему макету</h1>
<p class="s">«Для детей с 5 лет» → «С 7 лет»; адрес заменён. Остальное не тронуто.</p>
<div class="g">
<figure class="b"><img src="plakat_bylo.jpg" alt="Было"><figcaption>Было</figcaption></figure>
<figure class="a"><img src="plakat_demo.jpg" alt="Стало"><figcaption>Стало</figcaption></figure>
</div>
</body></html>
