<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Демо бота — пример диалога</title>
<meta name="description" content="Демо / пример работы: симулятор диалога Telegram-бота. Данные условные.">
<link rel="preload" href="../_fonts/Manrope-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="../_fonts/Manrope-Bold.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:"Manrope";src:url("../_fonts/Manrope-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Manrope";src:url("../_fonts/Manrope-SemiBold.ttf") format("truetype");font-weight:600;font-style:normal;font-display:block}
@font-face{font-family:"Manrope";src:url("../_fonts/Manrope-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:"Manrope";src:url("../_fonts/Manrope-ExtraBold.ttf") format("truetype");font-weight:800;font-style:normal;font-display:block}
@font-face{font-family:"Manrope Fallback";src:local("Arial");size-adjust:102%;ascent-override:100%;descent-override:25%}
:root{
  --bg:#ECEEF0; --panel:#FFFFFF; --ink:#1F2328; --muted:#5B636B; --line:#D3D8DD;
  --chat:#E3E6E9; --bot:#FFFFFF; --me:#C9CFD5; --btn:#F4F5F7; --btn-ink:#2E343A;
  --head:#4A525A; --head-ink:#FFFFFF; --accent:#3D4650; --ok:#2F5D45; --warn:#6B5A2A;
  --font:"Manrope","Manrope Fallback",Arial,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{padding:24px 0 8px}
h1{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);max-width:60ch}
.demo-note{display:inline-block;margin-top:12px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:.875rem;color:var(--muted)}
.switch{display:flex;gap:0;margin:20px 0 4px;border:2px solid var(--accent);border-radius:10px;overflow:hidden;width:100%;max-width:380px;background:var(--panel)}
.switch button{flex:1;min-height:48px;border:0;background:transparent;font-weight:700;cursor:pointer;padding:8px 12px;white-space:nowrap}
.switch button[aria-pressed="true"]{background:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start;padding:16px 0 40px}

/* телефон */
.phone{position:relative;width:100%;max-width:380px;height:640px;background:var(--chat);border:2px solid var(--accent);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--head);color:var(--head-ink)}
.ava{width:38px;height:38px;border-radius:50%;background:#8B939B;display:grid;place-items:center;font-weight:800;flex:none}
.bar b{display:block;font-weight:700;line-height:1.2}
.bar small{display:block;opacity:.8;font-size:.75rem;line-height:1.2}
.restart{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 10px;color:#fff;cursor:pointer;font-size:.8125rem;min-height:36px}
.feed{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.msg{max-width:88%;padding:8px 12px;border-radius:14px;white-space:pre-line;overflow-wrap:anywhere;font-size:.9375rem;line-height:1.45}
.msg.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.tag{display:inline-block;margin-bottom:4px;padding:2px 8px;border-radius:999px;background:#E7E0C8;color:var(--warn);font-size:.75rem;font-weight:700}
.tag.bc{background:#DDE3E8;color:var(--accent)}
.sys{align-self:center;max-width:94%;padding:6px 12px;border-radius:999px;background:rgba(74,82,90,.14);color:var(--accent);font-size:.8125rem;font-weight:600;text-align:center;display:flex;gap:8px;align-items:center}
.sys svg{flex:none}
.kb{align-self:stretch;display:flex;flex-direction:column;gap:4px}
.kb .row{display:flex;gap:4px}
.kb button{flex:1;min-height:44px;padding:8px 10px;background:var(--btn);border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--btn-ink);font-weight:600;font-size:.875rem;line-height:1.25;overflow-wrap:anywhere}
.kb button:hover{background:#fff}
.kb.used button{opacity:.55;pointer-events:none}
.kb.used button.picked{opacity:1;border-color:var(--accent)}
.typing{align-self:flex-start;background:var(--bot);padding:10px 14px;border-radius:14px;border-bottom-left-radius:4px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#8B939B;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.compose{display:flex;gap:6px;padding:8px;background:#F4F5F7;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:22px;font:inherit;font-size:16px;background:#fff}
.compose input:disabled{background:#ECEEF0;color:var(--muted)}
.compose button{min-width:44px;min-height:44px;border:0;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center}
.compose button:disabled{background:#AEB4BA;cursor:default}

/* окна внутри телефона */
.overlay{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:5}
.overlay[hidden]{display:none}
.ov-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--head);color:#fff}
.ov-head b{font-weight:700}
.ov-head button{margin-left:auto;min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer}
.ov-body{flex:1;overflow-y:auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--btn);font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;background:#FAFBFB}
.card b{display:block}
.card small{color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#DDE3E8;font-size:.75rem;font-weight:700;margin-top:4px}
.big{font-size:1.75rem;font-weight:800;margin:6px 0 14px}
.primary{width:100%;min-height:48px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;margin-bottom:8px}
.secondary{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--btn);font-weight:700;cursor:pointer}

/* правая панель */
.side{display:grid;gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.box h2{margin:0 0 10px;font-size:1.0625rem;font-weight:800}
.box ul{margin:0;padding-left:20px}
.box li{margin:4px 0}
.hint{color:var(--muted);font-size:.875rem;margin:0 0 8px}
.log{list-style:none;padding:0!important;margin:0;display:grid;gap:8px}
.log li{margin:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#FAFBFB;font-size:.875rem;overflow-wrap:anywhere}
.log li b{display:block;font-size:.8125rem;color:var(--accent)}
.log li.empty{border-style:dashed;color:var(--muted)}
.sheet{width:100%;border-collapse:collapse;font-size:.8125rem;margin-top:6px;display:block;overflow-x:auto}
.sheet td,.sheet th{border:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
.sheet th{background:#ECEEF0}
footer{padding:0 0 32px;color:var(--muted);font-size:.875rem}

@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .phone{margin:0 auto}
}
@media (max-width:420px){
  .phone{height:calc(100vh - 24px);min-height:520px;max-height:640px}
}
@media (prefers-reduced-motion:reduce){
  .feed{scroll-behavior:auto}.typing i{animation:none;opacity:.7}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1 id="pgTitle"></h1>
  <p class="sub" id="pgSub"></p>
  <span class="demo-note" id="pgNote"></span>
  <div class="switch" role="group" aria-label="Уровень бота" id="levelSwitch" hidden style="display:none">
    <button type="button" data-level="standard" aria-pressed="true">Стандарт</button>
    <button type="button" data-level="premium" aria-pressed="false">Премиум</button>
  </div>
</div></header>

<main class="wrap main">
  <section aria-label="Симулятор чата">
    <div class="phone" id="phone">
      <div class="bar">
        <div class="ava" id="ava" aria-hidden="true"></div>
        <div><b id="botName"></b><small>бот</small></div>
        <button type="button" class="restart" id="restart">Заново</button>
      </div>
      <div style="margin:8px 10px 0;padding:9px 12px;border-radius:14px;background:#F2C14E;color:#1B2733;font-weight:800;font-size:.9rem;line-height:1.3;text-align:center">👆 Нажимайте кнопки: всё кликабельно и работает, как в Telegram</div>
      <div class="feed" id="feed" role="log" aria-live="polite"></div>
      <form class="compose" id="compose" autocomplete="off">
        <input type="text" id="inp" aria-label="Сообщение" disabled>
        <button type="submit" id="send" aria-label="Отправить" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20.5v-7l10-1.5-10-1.5v-7l19 8.5z"/></svg>
        </button>
      </form>
      <div class="overlay" id="overlay" hidden></div>
    </div>
  </section>

  <aside class="side" aria-label="Что происходит за кулисами">
    <div class="box"><h2 id="incTitle"></h2><ul id="incList"></ul></div>
    <div class="box">
      <h2 id="logTitle"></h2>
      <p class="hint" id="logHint"></p>
      <ul class="log" id="log"></ul>
      <table class="sheet" id="sheet" hidden><thead></thead><tbody></tbody></table>
    </div>
  </aside>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
/* ============================================================
   СЦЕНАРИЙ. Чтобы сделать бота под нишу, правится ТОЛЬКО этот объект.
   Движок ниже ничего про нишу не знает.
   Подстановки в текстах: {biz} {service} {day} {time} {name} {phone} {question}
   Кнопка: {t:"подпись", go:"id узла", set:{ключ:значение}, level:"premium" (только премиум)}
   Кнопка-список: {from:"services"|"days"|"times", key:"service"|"day"|"time", go:"id"}
   Узел: text, tag, rows (ряды кнопок), input:{key,go,placeholder}, fx (эффекты), next (автопереход), level
   Эффекты: owner | sheet | db | broadcast | app | pay | note
   ============================================================ */
const scenario = {
  page: {
    title: "Демо бота: пример диалога",
    sub: "Нажимайте кнопки, как в Telegram. Так клиент общается с ботом вашего бизнеса.",
    note: "Демо / пример работы. Данные условные.",
    footer: "Это страница-симулятор. Реального бота и токенов здесь нет: сценарий показывает, как будет работать ваш бот.",
    logTitle: "Что видит владелец",
    logHint: "Здесь появляется то, что бот делает за кулисами.",
    logEmpty: "Пока ничего. Пройдите запись или оставьте заявку.",
    includesTitle: "Что входит в бота"
  },
  biz: "[название бизнеса]",
  bizLetter: "Б",
  owner: { name: "[имя клиента]", phone: "+7 000 000-00-00" },
  services: ["[услуга 1]", "[услуга 2]", "[услуга 3]"],
  prices:   ["[цена 1]", "[цена 2]", "[цена 3]"],
  days:     ["[день 1]", "[день 2]", "[день 3]"],
  times:    ["[время 1]", "[время 2]", "[время 3]"],
  faq: [
    { q: "[вопрос 1]", a: "[ответ на вопрос 1]" },
    { q: "[вопрос 2]", a: "[ответ на вопрос 2]" },
    { q: "[вопрос 3]", a: "[ответ на вопрос 3]" }
  ],
  levels: {
    standard: [],
    premium: [
      "Меню и кнопки, ответы на частые вопросы",
      "Каталог услуг и запись: услуга, день, время",
      "Заявка администратору, напоминания клиенту, выгрузка в Google-таблицу",
      "База данных: записи и клиенты хранятся и не теряются",
      "Мини-приложение: окно внутри Telegram (каталог, корзина или запись)",
      "Оплата прямо в боте",
      "Рассылки: одно сообщение сразу всем клиентам",
      "Допопция: ИИ-консультант отвечает своими словами (ваш ключ API или бесплатный)"
    ]
  },
  ui: {
    owner: "Владелец", sheetLabel: "Google-таблица", dbLabel: "База клиентов", payLabel: "Оплата",
    bcLabel: "Рассылка", reminderLabel: "Напоминание", inputOff: "Выберите кнопку", inputOn: "Напишите сообщение",
    back: "В меню", restart: "Заново", sheetCols: ["Клиент", "Услуга", "День", "Время"],
    appClose: "Закрыть", appTabs: ["Профиль", "История записей"], appTitle: "Личный кабинет",
    appProfile: "Профиль", appHistoryEmpty: "Записей пока нет", statusNew: "новая", statusDone: "выполнена",
    payTitle: "Оплата", payAmount: "[сумма] ₽", payBtn: "Оплатить", payCancel: "Отмена", payNote: "Условный экран, деньги не списываются.",
    aiTag: "ИИ, платная опция", bcTag: "Рассылка от владельца"
  },
  appHistory: [
    { date: "[дата 1]", service: "[услуга 1]", status: "выполнена" },
    { date: "[дата 2]", service: "[услуга 2]", status: "выполнена" }
  ],
  broadcast: { text: "[текст рассылки: акция, новость или напоминание для всех клиентов]", count: "[N] клиентов" },
  ai: {
    sample: "Подойдёт ли [услуга 1] для [ситуация клиента]?",
    answer: "[Ответ ИИ-консультанта на свободный вопрос клиента: коротко, по делу, с предложением записаться.]"
  },
  nodes: {
    start: {
      text: "Здравствуйте! Это бот «{biz}». Чем помочь?",
      rows: [
        [{ t: "Записаться", go: "book_service" }, { t: "Каталог услуг", go: "catalog" }],
        [{ t: "Частые вопросы", go: "faq" }, { t: "Оставить заявку", go: "request" }],
        [{ t: "Личный кабинет", go: "cabinet", level: "premium" }, { t: "Оплатить", go: "pay", level: "premium" }],
        [{ t: "Спросить ИИ-консультанта", go: "ai", level: "premium" }, { t: "Показать рассылку", go: "broadcast", level: "premium" }]
      ]
    },
    menu: { next: "start", text: "Главное меню:" },

    catalog: {
      text: "Каталог услуг. Выберите, чтобы узнать подробнее:",
      rows: [
        [{ from: "services", key: "service", go: "catalog_item" }],
        [{ t: "В меню", go: "start" }]
      ]
    },
    catalog_item: {
      text: "{service}\nЦена: {price}\n[описание услуги: что входит, сколько длится]",
      rows: [[{ t: "Записаться на {service}", go: "book_day" }], [{ t: "Назад в каталог", go: "catalog" }, { t: "В меню", go: "start" }]]
    },

    faq: {
      text: "Выберите вопрос:",
      rows: [[{ from: "faq", key: "faqIndex", go: "faq_answer" }], [{ t: "В меню", go: "start" }]]
    },
    faq_answer: {
      text: "{faqA}",
      rows: [[{ t: "Другие вопросы", go: "faq" }, { t: "Записаться", go: "book_service" }], [{ t: "В меню", go: "start" }]]
    },

    request: {
      text: "Опишите ваш вопрос одним сообщением. Администратор ответит вам в Telegram.",
      input: { key: "question", go: "request_sent", placeholder: "Ваш вопрос" }
    },
    request_sent: {
      text: "Спасибо! Заявка передана администратору. Ответим в ближайшее время.",
      fx: [
        { type: "owner", text: "Новая заявка от клиента:\n«{question}»\nКонтакт: {name}, {phone}" },
        { type: "sheet", row: ["{name}", "заявка", "-", "-"] },
        { type: "db", text: "Клиент {name} сохранён в базе, добавлена заметка: вопрос", level: "premium" }
      ],
      rows: [[{ t: "В меню", go: "start" }]]
    },

    book_service: {
      text: "Запись. Выберите услугу:",
      rows: [[{ from: "services", key: "service", go: "book_day" }], [{ t: "В меню", go: "start" }]]
    },
    book_day: {
      text: "{service}. Выберите день:",
      rows: [[{ from: "days", key: "day", go: "book_time" }], [{ t: "Назад", go: "book_service" }]]
    },
    book_time: {
      text: "{day}. Выберите время:",
      rows: [[{ from: "times", key: "time", go: "book_confirm" }], [{ t: "Назад", go: "book_day" }]]
    },
    book_confirm: {
      text: "Проверьте запись:\nУслуга: {service}\nДень: {day}\nВремя: {time}",
      rows: [[{ t: "Подтвердить", go: "book_done" }, { t: "Отменить", go: "start" }]]
    },
    book_done: {
      text: "Готово, вы записаны. Мы напомним о визите заранее.",
      fx: [
        { type: "owner", text: "Новая запись:\n{name}, {phone}\n{service}, {day}, {time}" },
        { type: "sheet", row: ["{name}", "{service}", "{day}", "{time}"] },
        { type: "db", text: "Клиент {name}: запись сохранена в карточке, история обновлена", level: "premium" },
        { type: "history", level: "premium" }
      ],
      rows: [
        [{ t: "Показать напоминание", go: "reminder" }],
        [{ t: "Оплатить запись", go: "pay", level: "premium" }, { t: "Личный кабинет", go: "cabinet", level: "premium" }],
        [{ t: "В меню", go: "start" }]
      ]
    },
    reminder: {
      text: "Напоминание: {day} в {time} вас ждут. {service}. Если планы изменились, нажмите «Перенести».",
      tag: "reminder",
      rows: [[{ t: "Перенести", go: "book_day" }, { t: "Всё в силе", go: "start" }]]
    },

    cabinet: {
      level: "premium",
      text: "Откройте личный кабинет: профиль и история записей.",
      fx: [{ type: "app" }],
      rows: [[{ t: "Открыть кабинет", go: "cabinet", level: "premium", open: "app" }], [{ t: "В меню", go: "start" }]]
    },

    pay: {
      level: "premium",
      text: "К оплате: {service}.\nНажмите кнопку, откроется экран оплаты.",
      rows: [[{ t: "Перейти к оплате", go: "pay", open: "pay" }], [{ t: "В меню", go: "start" }]]
    },
    pay_done: {
      level: "premium",
      text: "Оплата прошла (условно). Чек отправлен в чат.",
      fx: [
        { type: "owner", text: "Оплата получена: {name}, {service} (условный экран)" },
        { type: "pay", text: "Оплата записи «{service}»: статус «оплачено»" }
      ],
      rows: [[{ t: "В меню", go: "start" }]]
    },

    broadcast: {
      level: "premium",
      text: "Так клиент получает рассылку от владельца:",
      next: "broadcast_msg"
    },
    broadcast_msg: {
      level: "premium",
      tag: "bc",
      text: "{bcText}",
      fx: [{ type: "broadcast" }],
      rows: [[{ t: "Записаться", go: "book_service" }, { t: "В меню", go: "start" }]]
    },

    ai: {
      level: "premium",
      text: "Задайте вопрос своими словами. Например: «{aiSample}»",
      tag: "ai",
      input: { key: "question", go: "ai_answer", placeholder: "Ваш вопрос" }
    },
    ai_answer: {
      level: "premium",
      tag: "ai",
      text: "{aiAnswer}",
      rows: [[{ t: "Записаться", go: "book_service" }, { t: "Задать ещё вопрос", go: "ai" }], [{ t: "В меню", go: "start" }]]
    }
  }
};

/* ============================ ДВИЖОК ============================ */
(function(){
  "use strict";
  const S = scenario, U = S.ui;
  const $ = id => document.getElementById(id);
  const feed = $("feed"), inp = $("inp"), send = $("send"), overlay = $("overlay");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
  let level = "premium", data = {}, history = [], busy = false, pendingInput = null, token = 0;

  const ICON = {
    owner: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>',
    sheet: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3h16v18H4zM6 8v3h5V8zm7 0v3h5V8zM6 13v3h5v-3zm7 0v3h5v-3z"/></svg>',
    db: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C7 2 4 3.6 4 5.5v13C4 20.4 7 22 12 22s8-1.6 8-3.5v-13C20 3.6 17 2 12 2zm0 2c3.9 0 6 1 6 1.5S15.9 7 12 7 6 6 6 5.5 8.1 4 12 4z"/></svg>',
    pay: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5h18v4H3zm0 6h18v8H3zm3 3v2h5v-2z"/></svg>',
    bc: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10v4h3l5 4V6L6 10zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>'
  };

  function fill(str){
    const v = Object.assign({
      biz: S.biz, name: S.owner.name, phone: S.owner.phone, price: "", faqA: "",
      bcText: S.broadcast.text, aiSample: S.ai.sample, aiAnswer: S.ai.answer
    }, data);
    return String(str).replace(/\{(\w+)\}/g, (m, k) => (v[k] === undefined ? "" : v[k]));
  }
  function el(tag, cls, text){
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function scroll(){ feed.scrollTop = feed.scrollHeight; }
  function allowed(x){ return !x.level || x.level === "standard" || level === "premium"; }

  function addMsg(who, text, tag){
    const m = el("div", "msg " + who);
    if (tag){
      const t = el("span", "tag" + (tag === "bc" ? " bc" : ""), tag === "ai" ? U.aiTag : tag === "bc" ? U.bcTag : U.reminderLabel);
      m.appendChild(t); m.appendChild(document.createElement("br"));
    }
    m.appendChild(document.createTextNode(text));
    feed.appendChild(m); scroll();
  }
  function addSys(kind, text){
    const s = el("div", "sys");
    s.insertAdjacentHTML("beforeend", ICON[kind] || "");
    s.appendChild(document.createTextNode(text));
    feed.appendChild(s); scroll();
  }
  async function typing(){
    const t = el("div", "typing"); t.innerHTML = "<i></i><i></i><i></i>";
    feed.appendChild(t); scroll(); await sleep(450); t.remove();
  }

  /* журнал владельца справа */
  function logAdd(kind, label, text){
    const ul = $("log"); const e = ul.querySelector(".empty"); if (e) e.remove();
    const li = el("li"); li.appendChild(el("b", "", label)); li.appendChild(document.createTextNode(text));
    ul.insertBefore(li, ul.firstChild);
  }
  function sheetAdd(row){
    const t = $("sheet"); t.hidden = false;
    const tr = document.createElement("tr");
    row.forEach(c => tr.appendChild(el("td", "", fill(c))));
    t.tBodies[0].appendChild(tr);
  }
  function resetLog(){
    const ul = $("log"); ul.innerHTML = "";
    ul.appendChild(el("li", "empty", S.page.logEmpty));
    const t = $("sheet"); t.hidden = true; t.tBodies[0].innerHTML = "";
  }

  function effects(node){
    (node.fx || []).forEach(f => {
      if (f.level && !allowed(f)) return;
      if (f.type === "owner"){ addSys("owner", "Заявка ушла владельцу"); logAdd("owner", U.owner, fill(f.text)); }
      else if (f.type === "sheet"){ addSys("sheet", "Добавлено в таблицу"); sheetAdd(f.row); logAdd("sheet", U.sheetLabel, "Добавлена строка: " + f.row.map(fill).join(" | ")); }
      else if (f.type === "db"){ addSys("db", "Сохранено в базе клиентов"); logAdd("db", U.dbLabel, fill(f.text)); }
      else if (f.type === "pay"){ logAdd("pay", U.payLabel, fill(f.text)); }
      else if (f.type === "broadcast"){ logAdd("bc", U.bcLabel, "Владелец отправил сообщение: " + S.broadcast.count); }
      else if (f.type === "history"){ history.unshift({ date: fill("{day}"), service: fill("{service}"), status: U.statusNew }); }
    });
  }

  /* кнопки */
  function expand(rows){
    const out = [];
    rows.forEach(row => {
      const r = [];
      row.forEach(b => {
        if (!allowed(b)) return;
        if (b.from){
          const list = b.from === "faq" ? S.faq.map(x => x.q) : S[b.from];
          list.forEach((label, i) => out.push([Object.assign({}, b, { t: label, val: label, idx: i })]));
        } else r.push(b);
      });
      if (r.length) out.push(r);
    });
    return out;
  }
  function addKeyboard(rows){
    const kb = el("div", "kb");
    expand(rows).forEach(row => {
      const r = el("div", "row");
      row.forEach(b => {
        const btn = el("button", "", fill(b.t)); btn.type = "button";
        btn.addEventListener("click", () => onButton(b, btn, kb));
        r.appendChild(btn);
      });
      kb.appendChild(r);
    });
    feed.appendChild(kb); scroll();
  }
  async function onButton(b, btn, kb){
    if (busy) return;
    kb.classList.add("used"); btn.classList.add("picked");
    if (b.open){ kb.classList.remove("used"); btn.classList.remove("picked"); openOverlay(b.open); return; }
    addMsg("me", btn.textContent);
    if (b.from === "faq"){ data.faqIndex = b.idx; data.faqA = S.faq[b.idx].a; }
    else if (b.from === "services"){ data.service = b.val; data.price = S.prices[b.idx]; }
    else if (b.from){ data[b.key] = b.val; }
    if (b.set) Object.assign(data, b.set);
    await run(b.go);
  }

  async function run(id){
    const my = ++token;
    busy = true; setInput(null);
    const node = S.nodes[id];
    if (!node){ busy = false; return; }
    if (node.level && !allowed(node)){ busy = false; return; }
    await typing(); if (my !== token) return;
    if (node.text) addMsg("bot", fill(node.text), node.tag);
    effects(node);
    if (node.rows) addKeyboard(node.rows);
    if (node.next){ await sleep(300); if (my !== token) return; await run(node.next); return; }
    busy = false;
    if (node.input) setInput(node.input);
  }

  function setInput(cfg){
    pendingInput = cfg;
    inp.disabled = send.disabled = !cfg;
    inp.placeholder = cfg ? (cfg.placeholder || U.inputOn) : U.inputOff;
    inp.value = "";
    if (cfg) { try { inp.focus({ preventScroll: true }); } catch(e){} }
  }
  $("compose").addEventListener("submit", async e => {
    e.preventDefault();
    if (!pendingInput || busy) return;
    const text = inp.value.trim(); if (!text) return;
    const cfg = pendingInput; data[cfg.key] = text;
    addMsg("me", text);
    await run(cfg.go);
  });

  /* окна внутри телефона */
  function openOverlay(kind){
    overlay.innerHTML = ""; overlay.hidden = false;
    const head = el("div", "ov-head");
    head.appendChild(el("b", "", kind === "app" ? U.appTitle : U.payTitle));
    const close = el("button", "", U.appClose); close.type = "button";
    close.addEventListener("click", () => { overlay.hidden = true; });
    head.appendChild(close);
    const body = el("div", "ov-body");
    if (kind === "app"){
      const tabs = el("div", "tabs"); tabs.setAttribute("role", "tablist");
      const pane = el("div");
      const draw = i => {
        pane.innerHTML = "";
        [...tabs.children].forEach((t, j) => t.setAttribute("aria-selected", j === i));
        if (i === 0){
          const c = el("div", "card"); c.appendChild(el("b", "", fill("{name}"))); c.appendChild(el("small", "", fill("{phone}")));
          pane.appendChild(c);
          const c2 = el("div", "card"); c2.appendChild(el("small", "", S.biz)); pane.appendChild(c2);
        } else {
          const all = history.concat(S.appHistory);
          all.forEach(h => {
            const c = el("div", "card"); c.appendChild(el("b", "", h.service)); c.appendChild(el("small", "", h.date));
            c.appendChild(document.createElement("br")); c.appendChild(el("span", "pill", h.status)); pane.appendChild(c);
          });
        }
      };
      U.appTabs.forEach((t, i) => { const b = el("button", "", t); b.type = "button"; b.setAttribute("role", "tab"); b.addEventListener("click", () => draw(i)); tabs.appendChild(b); });
      body.appendChild(tabs); body.appendChild(pane); draw(0);
    } else {
      body.appendChild(el("div", "", fill(data.service || S.services[0])));
      body.appendChild(el("div", "big", U.payAmount));
      const ok = el("button", "primary", U.payBtn); ok.type = "button";
      ok.addEventListener("click", async () => { overlay.hidden = true; addMsg("me", U.payBtn); await run("pay_done"); });
      const no = el("button", "secondary", U.payCancel); no.type = "button";
      no.addEventListener("click", () => { overlay.hidden = true; });
      body.appendChild(ok); body.appendChild(no); body.appendChild(el("p", "hint", U.payNote));
    }
    overlay.appendChild(head); overlay.appendChild(body);
    close.focus();
  }

  /* сборка страницы */
  function buildStatic(){
    $("pgTitle").textContent = S.page.title; $("pgSub").textContent = S.page.sub; $("pgNote").textContent = S.page.note;
    $("botName").textContent = S.biz; $("ava").textContent = S.bizLetter;
    $("logTitle").textContent = S.page.logTitle; $("logHint").textContent = S.page.logHint;
    $("foot").textContent = S.page.footer; $("restart").textContent = U.restart;
    document.title = S.page.title;
  }
  function buildIncludes(){
    $("incTitle").textContent = S.page.includesTitle;
    const ul = $("incList"); ul.innerHTML = "";
    S.levels[level].forEach(x => ul.appendChild(el("li", "", x)));
  }
  function restart(){
    token++; busy = false; data = {}; history = []; feed.innerHTML = ""; overlay.hidden = true;
    resetLog(); buildIncludes(); setInput(null); run("start");
  }
  document.querySelectorAll("#levelSwitch button").forEach(b => b.addEventListener("click", () => {
    level = b.dataset.level;
    document.querySelectorAll("#levelSwitch button").forEach(x => x.setAttribute("aria-pressed", x === b));
    restart();
  }));
  $("restart").addEventListener("click", restart);
  buildStatic(); restart();
})();
</script>
</body>
</html>
